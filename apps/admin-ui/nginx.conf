# apps/admin-ui/nginx.conf — static SPA server for the admin-ui image.
#
# Runs under nginxinc/nginx-unprivileged (non-root master process), so no
# `user` directive here and all writable paths point at /tmp instead of the
# stock /var/cache/nginx (not writable by the unprivileged uid).
#
# `/v1` calls from the built SPA are relative paths (see vite.config.ts's
# dev-only proxy) — in the cluster, Ingress path-routes them to
# control-plane on the same domain, so this server only ever needs to serve
# static files + fall back to index.html for client-side routing.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout;
  error_log  /dev/stderr;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/javascript application/xml image/svg+xml;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }

    # 公开 API 文档站(VitePress 静态);SPA 路由避开了 /docs(用 /handbook)。
    location = /docs { return 301 /docs/; }

    location /docs/ {
      try_files $uri $uri/ /docs/index.html;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}

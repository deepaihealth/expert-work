repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 与 pyproject 的 ruff 依赖同步升级(0.16.3);两套版本并存会在格式器
    # 行为变化时互相打架(2026-08-20 差点发生)。
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # k8s manifests (infra/k8s/) conventionally pack multiple documents
        # per file with `---` separators; each document is still validated.
        args: [--allow-multiple-documents]
        # helm templates carry Go ``{{ }}`` and the HA-failover / run-queue compose
        # overlays use docker-compose's ``!override`` merge tag — both are valid for
        # their tooling but PyYAML's safe_load (check-yaml) can't parse them.
        exclude: ^(deploy/k8s/.*helm.*\.yaml|infra/docker-compose\.(ha-e2e|queue-e2e)\.yml)$
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

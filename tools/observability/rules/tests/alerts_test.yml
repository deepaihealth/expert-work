# promtool unit tests for alerts.yml — sandbox-egress-age-quota Task 3 fix round 1.
# Run: promtool test rules tools/observability/rules/tests/alerts_test.yml
#
# Covers ExpertWorkSandboxEgressAuthBlocked: the 407/blocked_auth sandbox-egress
# alert fed by the control-plane's SandboxEgressMetricsWorker scan of
# sandbox_egress_audit.

rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # A steady stream of blocked_auth verdicts → increase() over the last 15m
  # is > 0 → the alert fires immediately (for: 0m).
  - interval: 1m
    name: sandbox egress blocked_auth alert fires on 407 rejections
    input_series:
      - series: 'expert_work_control_plane_sandbox_egress_blocked_total{verdict="blocked_auth"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: ExpertWorkSandboxEgressAuthBlocked
        exp_alerts:
          - exp_labels:
              severity: P2
              verdict: blocked_auth
            exp_annotations:
              summary: "Sandbox egress rejected with 407 (blocked_auth)"
              description: "15 sandbox egress attempt(s) were rejected by the credential proxy with 407 in the last 15m — most likely an egress token that outlived its sandbox (or a warm session past its token TTL before the age cap kicked in)."
              runbook_url: "https://github.com/deepaihealth/expert-work/blob/main/docs/runbooks/control-plane.md"

  # Only non-auth verdicts (blocked_ssrf) present — the blocked_auth series
  # doesn't exist, so increase() is the empty vector (not 0) — no alert,
  # same "absence, not zero" semantics as burn_rate_test.yml.
  - interval: 1m
    name: non-auth verdicts raise no alert
    input_series:
      - series: 'expert_work_control_plane_sandbox_egress_blocked_total{verdict="blocked_ssrf"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: ExpertWorkSandboxEgressAuthBlocked
        exp_alerts: []

  # ExpertWorkLangfuseDeliveryFailing (B-153 follow-up). The control-plane
  # exports every stage at 0 from import time, so a healthy pod is a flat-0
  # series — that must stay silent.
  - interval: 1m
    name: langfuse delivery alert stays silent on pre-initialised zero series
    input_series:
      - series: 'expert_work_langfuse_delivery_failures_total{stage="export",instance="cp-0"}'
        values: "0x20"
      - series: 'expert_work_langfuse_delivery_failures_total{stage="start_span",instance="cp-0"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: ExpertWorkLangfuseDeliveryFailing
        exp_alerts: []

  # A single export failure on one pod (low traffic: one failed batch is all
  # a real outage may produce in 15m) fires, summed across pods, per stage.
  - interval: 1m
    name: langfuse delivery alert fires on a single export failure
    input_series:
      - series: 'expert_work_langfuse_delivery_failures_total{stage="export",instance="cp-0"}'
        values: "0x10 1x10"
      - series: 'expert_work_langfuse_delivery_failures_total{stage="export",instance="cp-1"}'
        values: "0x20"
      - series: 'expert_work_langfuse_delivery_failures_total{stage="start_span",instance="cp-0"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: ExpertWorkLangfuseDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: P2
              stage: export
            exp_annotations:
              summary: "Langfuse trace delivery failing (stage=export)"
              description: "1 Langfuse delivery failure(s) at stage export in the last 15m — traces for these LLM calls are missing from Langfuse."
              runbook_url: "https://github.com/deepaihealth/expert-work/blob/main/docs/runbooks/langfuse.md"

  # The B-153 shape: every LLM call's start_span failing.
  - interval: 1m
    name: langfuse delivery alert fires on persistent start_span failures
    input_series:
      - series: 'expert_work_langfuse_delivery_failures_total{stage="start_span",instance="cp-0"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: ExpertWorkLangfuseDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: P2
              stage: start_span
            exp_annotations:
              summary: "Langfuse trace delivery failing (stage=start_span)"
              description: "15 Langfuse delivery failure(s) at stage start_span in the last 15m — traces for these LLM calls are missing from Langfuse."
              runbook_url: "https://github.com/deepaihealth/expert-work/blob/main/docs/runbooks/langfuse.md"

  # Failures older than the 15m window resolve the alert.
  - interval: 1m
    name: langfuse delivery alert resolves once failures age out of the window
    input_series:
      - series: 'expert_work_langfuse_delivery_failures_total{stage="end",instance="cp-0"}'
        values: "0 1 1x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: ExpertWorkLangfuseDeliveryFailing
        exp_alerts: []

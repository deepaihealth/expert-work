# Bench-only agent — 二期 PR1 Task 1(入口链延迟基线用,不是产品 Agent)。
#
# 2.0.0 = 二期扩展场景(1.0.0 是一期未入仓的手工版):开持久工作区 + 长期
# 记忆全链(write_back + rerank + verify),8 个入口链段全部可触发。
#
# 结构照 manifests/canonical-agent/v1.0.0.yaml;字段拼写以
# packages/expert-work-protocol/.../agent_spec.py 为准,解析守卫在
# tools/bench/test_entry_latency.py(test_bench_entry_manifest_parses_
# against_protocol_schema)。注册:POST /v1/agents,body
# {"manifest_yaml": "<本文件全文>"} —— 见 tools/bench/README.md。
apiVersion: expert_work.io/v1
kind: Agent
metadata:
  name: bench-entry
  version: "2.0.0"
  # Logical tenant slug, not the UUID — registration maps it to the caller's
  # tenant via session (AgentMetadata docstring). Informational placeholder.
  tenant: bench
spec:
  description: >-
    Entry-chain latency bench agent (phase-2). Long-term memory full chain
    (write-back + rerank + verify) plus persistent workspace, so all 8
    entry-chain spans light up under tools/bench/entry_latency.py.

  tenant_config:
    isolation_level: dedicated_sandbox

  model:
    provider: anthropic
    name: claude-sonnet-4-5
    # No api_key_ref — the agent build resolves the anthropic key from the
    # platform-configured credential, same as canonical-agent.
    temperature: 0.2
    max_tokens: 4096
    fallback:
      - provider: anthropic
        name: claude-haiku-4-5-20251001

  system_prompt:
    template: "你是团队知识助手,回答成员关于系统与流程的问题。"

  memory:
    # LongTermMemorySpec 没有 enabled 字段(extra="forbid",块存在即启用);
    # rerank 是平台配了 reranker 就走,不在 manifest 里开。
    long_term:
      write_back: true
      retrieve_top_k: 5
      verify_reads: true

  sandbox:
    runtime: gvisor
    resources:
      cpu: "1.0"
      memory: 1Gi
    network:
      egress: proxy
    filesystem:
      readonly_root: true
      writable:
        - /tmp
      # workspace_ingest 段(8 段之一)只在这个开关开着时存在。
      persistent_workspace: true

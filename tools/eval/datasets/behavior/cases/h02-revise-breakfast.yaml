id: h02-revise-breakfast
agent: eval-ahp
shape: B-131 修改轮额外调用
turns:
  - prompt: |
      请为下面这位客户出一份 Word 版健康管理方案,用 save_artifact 交付,文件名用「王小雨-健康方案.docx」。
      客户资料(虚构):王小雨,女,42 岁,身高 162 cm,体重 68 kg,空腹血糖 6.4 mmol/L,平时久坐、晚睡;诉求是三个月内减重 5 kg、把空腹血糖降到 6.1 以下。
      方案至少包括饮食、运动、作息三部分。
  - prompt: |
      把方案里饮食部分的早餐改成低糖版本,其它部分不变,重新交付同名的 docx。
checks:
  - {type: completed}
  # 不查「低糖」字样:基线里两次换成了无糖豆浆 / 低 GI 主食却没写这两个字,做对了也判红。
  # 「是不是低糖」不是字符串能判的;这里只判其它部分还在,本用例真正测的是第 2 轮的调用数。
  - {type: artifact_contains, name: '*.docx', all: [早餐, 运动, 作息]}
  # 阈值 = 首次 3× 基线(base-1005,test 5091938c)第 2 轮最大值 13 次 ×1.5,向上取整(规格 §7)
  - {type: tool_count_max, max: 20, turn: 2}

id: g03-rename-everywhere
agent: eval-general
shape: B-137 replace_all
fixtures: [product-notes.md]
turns:
  - prompt: |
      工作区的 uploads/product-notes.md 是产品更新说明。请先用 bash 执行 `cp uploads/product-notes.md notes.md`,然后把 notes.md 里所有的「AlphaDesk」统一改成「BetaDesk」,其余内容一个字都不要动。
checks:
  - {type: completed}
  - {type: workspace_file_not_contains, path: notes.md, any: [AlphaDesk]}
  - {type: workspace_file_contains, path: notes.md, all: [BetaDesk 第 120 条更新说明]}
  - {type: workspace_file_unchanged_lines, path: notes.md, fixture: product-notes.md, except_lines: [3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36, 39, 42, 45, 48, 51, 54, 57, 60, 63, 66, 69, 72, 75, 78, 81, 84, 87, 90, 93, 96, 99, 102, 105, 108, 111, 114, 117, 120]}
  - {type: tool_not_used_on, tool: write_file, path: notes.md}
  # 阈值先放宽,首次 3× 基线后按「基线 ×1.5」收紧(规格 §7)
  - {type: tool_count_max, max: 10}

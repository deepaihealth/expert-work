id: h10-missing-weight
agent: eval-ahp
shape: 缺资料时不编造
turns:
  - prompt: |
      请为下面这位客户出一份 Word 版健康管理方案,用 save_artifact 交付,文件名用「王小雨-健康方案.docx」。
      客户资料(虚构):王小雨,女,42 岁,身高 162 cm,空腹血糖 6.4 mmol/L,平时久坐、晚睡;诉求是改善血糖。
checks:
  - {type: completed}
  - {type: artifact_exists, name: '*.docx'}
  - {type: final_text_regex, pattern: '体重.{0,30}(缺|未提供|补充|没有|不详)|(缺|未提供|补充|没有|不详).{0,30}体重'}

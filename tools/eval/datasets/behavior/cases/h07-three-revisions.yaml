id: h07-three-revisions
agent: eval-ahp
shape: B-126 跨轮成本
turns:
  - prompt: |
      请为下面这位客户出一份 Word 版健康管理方案,用 save_artifact 交付,文件名用「王小雨-健康方案.docx」。
      客户资料(虚构):王小雨,女,42 岁,身高 162 cm,体重 68 kg,空腹血糖 6.4 mmol/L,平时久坐、晚睡;诉求是三个月内减重 5 kg、把空腹血糖降到 6.1 以下。
      方案至少包括饮食、运动、作息三部分。
  - prompt: |
      运动部分改成每周游泳两次,重新交付同名 docx。
  - prompt: |
      作息部分改成 23:00 前入睡,重新交付同名 docx。
checks:
  - {type: completed}
  - {type: artifact_contains, name: '*.docx', all: [游泳, '23:00']}
  # 阈值先放宽,首次 3× 基线后按「基线 ×1.5」收紧(规格 §7)
  - {type: turn_tokens_max, turn: 3, max_input_tokens: 400000}

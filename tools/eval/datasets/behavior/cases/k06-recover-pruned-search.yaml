id: k06-recover-pruned-search
agent: eval-kb-prune
shape: 跨轮清理后找回旧检索结果(B-206 track D):第 1 轮检索到的段落里就有答案,第 3 轮开头它已被清成一行引用
turns:
  - prompt: |
      VT-330 的电池容量是多少瓦时?
  - prompt: |
      长期不用的时候,电量充到多少再存放比较好?
  - prompt: |
      VT-330 用交流电充满需要多长时间?
checks:
  - {type: completed}
  # 满充时间只写在 VT-330 那一章(第 1 轮检索到的段落里),137 分钟 = 2 小时 17 分
  - {type: final_text_regex, pattern: '(?<![0-9])137(?![0-9])|2\s*小时\s*17\s*分'}
  # 同一段落里相邻型号的满充时间(VT-220 112 分钟、VT-440 163 分钟):答成它们就是串了型号
  - {type: final_text_not_regex, pattern: '(?<![0-9.])(?:112|163)(?![0-9])'}
  # 按引用重读一次或重搜一次就够;不许在第 3 轮反复检索
  - {type: tool_count_max, max: 3, turn: 3}
  # 暂定上限,不是「清理发生了」的证据:基线不清理、一次调用就能答,输入反而可能更少。
  # 取值 = 清理后第 3 轮最多 3 次工具调用、4 次模型调用的估算(每次调用约 5,200 的系统提示词与
  # 工具清单 + 前两轮约 900 + 本轮逐次读进来的整本说明书约 2,800)约 41,000,上浮两成。
  # 第一次 3× 真跑之后按规格 §7 改成实测最大值 ×1.5。
  - {type: turn_tokens_max, turn: 3, max_input_tokens: 50000}

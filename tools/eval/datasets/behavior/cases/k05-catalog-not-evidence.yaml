id: k05-catalog-not-evidence
agent: eval-kb
shape: 目录不是证据(B-175 P4):hr 库的描述提到年度体检,文档里却没有,不能凭描述作答
turns:
  - prompt: |
      公司的年度员工体检一般安排在每年几月?
checks:
  - {type: tool_used, tool: knowledge_search}
  - {type: final_text_regex, pattern: '没有|未(提及|找到|查到|说明|记载|包含|涉及)|找不到|查不到|无相关|无法(确认|确定|找到)|不包含'}
  # 说了「没有」却仍编出月份的也不算(「没有特殊情况不会调整」那类):回答里不许出现几月。
  # 跟在「2026 年」这类年份后面的月是在说日期(「截至 2026 年 10 月」),不算;「每年 4 月」「四月份」「三、四月」算。
  - type: final_text_not_regex
    pattern: '(?<![0-9一二三四五六七八九十])(?<![0-9]年)(?<![0-9]年\s)(?<![0-9]\s年)(?<![0-9]\s年\s)(?:[0-9]+|[一二三四五六七八九十]{1,3})\s*月'

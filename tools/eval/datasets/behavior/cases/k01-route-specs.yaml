id: k01-route-specs
agent: eval-kb
shape: 多库按库检索(B-175 P4):只有参数库能答的问题,第一次检索就该只查参数库
turns:
  - prompt: |
      KX-512 的额定功率是多少瓦?
checks:
  - {type: completed}
  - {type: final_text_contains, all: ["1730"]}
  # K2 = b140-kb-specs(eval-kb 的第二个 knowledge_base_refs);传句柄或库名都算,同时选了别的库(含全选)不算
  - type: tool_arg_contains
    tool: knowledge_search
    arg: bases
    any_of: [K2, b140-kb-specs]
    none_of: [K1, K3, b140-kb-warranty, b140-kb-hr]
    call: first
  - {type: tool_count_max, tool: knowledge_search, max: 3}

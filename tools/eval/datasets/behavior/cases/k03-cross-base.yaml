id: k03-cross-base
agent: eval-kb
shape: 多库按库检索(B-175 P4):答案跨两个库(型号 → 品类在参数库,品类 → 保修期在保修库)
turns:
  - prompt: |
      KX-305 是哪一类产品?这一类产品的整机保修期是多久?

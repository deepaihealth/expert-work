id: h05-minimal-cover
agent: eval-ahp
shape: 交付件封面极简
turns:
  - prompt: |
      请为下面这位客户出一份 Word 版健康管理方案,用 save_artifact 交付,文件名用「王小雨-健康方案.docx」。
      客户资料(虚构):王小雨,女,42 岁,身高 162 cm,体重 68 kg,空腹血糖 6.4 mmol/L,平时久坐、晚睡;诉求是三个月内减重 5 kg、把空腹血糖降到 6.1 以下。
      方案至少包括饮食、运动、作息三部分。方案要有封面,封面只放标题、客户称呼和日期。
checks:
  - {type: completed}
  - {type: artifact_contains, name: '*.docx', all: [王小雨]}
  - {type: artifact_not_contains, name: '*.docx', any: [服务周期]}
  - {type: artifact_not_contains, name: '*.docx', any: [教练]}

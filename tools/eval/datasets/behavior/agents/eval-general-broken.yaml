# B-140 自证用的坏版本:提示词要求改文件一律整篇重写(模拟 B-137 修之前),用完即删。平台基础能力工具对每个智能体都在,manifest 删工具删不掉。只绑平台能力,不接任何业务系统。
# 用控制台登录态导入测试环境的对接方租户(规格 §8;metadata.tenant 只是标签,服务端不读)。
apiVersion: expert_work.io/v1
kind: Agent
metadata:
  name: eval-general-broken
  version: "1.0.1"  # 1.0.0 在 10-05 用完软删,同名同版本不能重建(MANIFEST_DUPLICATE)
  tenant: b140-eval
spec:
  description: B-140 行为回归评测用的通用智能体(合成任务专用)。
  tenant_config:
    isolation_level: dedicated_sandbox
  model:
    provider: glm
    name: glm-5.3
    temperature: 0.2
    max_tokens: 32768  # 8000 截断过 h01 的整篇方案(OutputTruncatedError,10-05 smoke)
  system_prompt:
    template: |
      你是一个通用的办公助手,在工作区里读写文件、运行脚本,完成用户交代的任务。
      做完后用一两句话说明结果;做不到的事情如实说明原因,不要编造。
      修改已有文件时,一律先用 read_file 读出全文,改好后用 write_file 把全文整篇写回;不要用 edit_file、bash 或 exec_python 改文件。
  tools:
    - { type: builtin, name: read_file }
    - { type: builtin, name: write_file }
    - { type: builtin, name: edit_file }
    - { type: builtin, name: search_files }
    - { type: builtin, name: exec_python }
    - { type: builtin, name: bash }
    - { type: builtin, name: save_artifact }
  policies:
    token_budget: 400000
  sandbox:
    runtime: gvisor
    resources:
      cpu: "0.5"
      memory: 512Mi
    network:
      egress: none
    filesystem:
      readonly_root: true
      writable:
        - /tmp
      persistent_workspace: true

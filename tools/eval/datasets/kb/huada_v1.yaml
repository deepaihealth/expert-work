- id: faq_xlsx-0119
  query: 轻营养指导
  source: faq_xlsx
  tags:
  - 轻
  expected:
  - document: 华大产品汇总.xlsx
    anchor: 1.调整宏量营养素的构成比和来源：多摄入优质蛋白如肉、蛋、鱼、豆、奶，脂肪建议多
    page: null
  - document: 华大营养益生菌FAQ-2025.xlsx
    anchor: 1.调整宏量营养素的构成比和来源：多摄入优质蛋白如肉、蛋、鱼、豆、奶，脂肪建议多
    page: null
  - document: 华大营养产品知识库.xlsx
    anchor: 1.调整宏量营养素的构成比和来源：多摄入优质蛋白如肉、蛋、鱼、豆、奶，脂肪建议多
    page: null
  answer: '助力减脂的小建议，快学起来

    1.调整宏量营养素的构成比和来源：多摄入优质蛋白如肉、蛋、鱼、豆、奶，脂肪建议多以含不饱和脂肪酸的油脂和食物如橄榄油、亚麻籽油、茶油等，少摄入含饱和脂肪酸较多的动物油脂和食物；碳水化合应选择全谷物，如燕麦、小米、红薯等，严格限制糖、巧克力、含糖饮料及零食；

    2.保证维生素和矿物质的摄入：新鲜的蔬菜和水果含能量低，又可以提供维生素和矿物质，营养丰富且饱物感明显，不仅有助于减肥，还能改善代谢紊乱，必要情况下可补充复合维生素矿物质片；

    3.增加膳食纤维的摄入：每天膳食纤维的供量25-30g为宜，含膳食纤维丰富的食物为麦麸、玉米、糙米、大豆、燕麦、荞麦、茭白、芹菜、苦瓜等。

    4.三餐合理分配：比例应是午餐>早餐>晚餐，同时将动物性蛋白和脂肪含量多的食品尽量安排在早餐和午餐吃，晚上以清淡为主，含糖量低且利于消化的食物；

    5.合理烹调方式：宜采用蒸、煮、炖、汆等，忌用油煎、炸的方法，煎炸食物含脂肪较多，并刺激食欲，因此不利于减肥。同时，食物必须大众化、多样化，切勿迷信时髦减肥食品。事实上，只要含能量低、来源分配得当，而且营养平衡，那么任何普通饮食都可成为良好的减肥饮食，同时可自己选择与搭配色、香、味、形；

    6.行为调整：找出不良的生活或饮食习惯，然后加以调整。具体的措施有:①感到焦虑时，应避免采用进食来缓解;②避免边看电视边吃零食;③进食时充分咀嚼避免进食速度过快;④规律饮食，不暴饮暴食，避免吃饭过饱;⑤避免过量饮酒或经常在外就餐;晚餐要少，避免睡前加餐或晚餐吃得非常好之后又很少活动;⑦多吃蔬菜，少吃荤菜;⑧避免偏食、挑食，改掉喜吃甜食、零食、临睡前吃点心、饭后立即睡等习惯；

    7.规律的、中等强度的有氧运动：有氧运动多为动力型的,有大肌肉群(如股四头肌、肱二头肌等)参与的运动，例如:走路、骑车、爬山、打球、慢跑、跳舞、游泳、划船、滑冰、滑雪及舞蹈等,运动中主要靠燃烧体内脂肪提供能量。

    如出现以下症状时，应立即停止运动:

    (1)心跳不正常，如出现心率比日常运动时明显加快、心律不齐、心悸、心慌、心率快而后突然变慢等。

    (2)运动中或运动后即刻出现胸部、上臂或咽喉部疼痛或沉重感。

    (3)特别眩晕或轻度头痛、意识紊乱、出冷汗或晕厥。

    (4)严重气短。

    (5)身体任何一部分突然疼痛或麻木和一时性失明或失语等。'

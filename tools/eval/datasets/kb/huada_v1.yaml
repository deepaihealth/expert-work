  answer: 华大常青鱼油磷虾油为普通食品，可补充EPA,DHA和虾青素。其中的Omega-3脂肪酸本身就被美国心脏协会推荐为心血管疾病的二级预防措施。然而，为避免可能的相互作用影响药效，我们强烈建议您在开始服用本品前，咨询您的主治医生或临床药师，并在服用期间定期监测血脂水平，由医生判断是否需要调整药物剂量。

  - document: 产品说明书 ：益休.docx
    anchor: 优美达系列的益生菌“各有所长”，如果您需要改善不止一种情况的时候，是可以同时食用
    page: null
  answer: '优美达系列的益生菌“各有所长”，如果您需要改善不止一种情况的时候，是可以同时食用2～3种的，根据自身情况选择即可。如担心一次摄入太多活菌会使肠道不适应，则可分别间隔数个小时食用；如尝试同时食用后没有任何不适应，则放心同时食用。


    Q1:益畅和益顺有什么区别?


    A:两者都是针对便秘的益生菌产品，但定位和配方有差异:


    益畅:基础通用型，核心是5株联合菌株+3大益生元，每袋180亿CFU活菌。适合大多数肠道不畅，嗯嗯受阻的人群，益畅-咀嚼片形式，便捷好咀嚼。


    益顺:专为京东高净值人群研发，经常嗯嗯费力，特别是嗯嗯钉子户等困扰希望有高需求追求高效解决方案的用户。益顺采用4株专利菌+6重复合膳食纤维+火麻仁+3大益生元的四维配方，每袋活菌数高达300亿CFU。


    Q2:如果只吃一款，哪个更适合我?片剂好还是粉剂好?


    A:选择取决于您的便秘严重程度和个人偏好。


    产品选择:


    如果是普通、偶发的排便不畅，推荐益畅。


    如果是长期、顽固的便秘，或感觉单独吃益畅益生菌觉得效果感受不那么显著，比较集于追求高效解决，推荐益顺。


    剂型选择:


    益畅片剂和益顺粉剂都采用了我们专利菌株冻干保护技术、多层包埋技术，两者形式益生菌活性都能得到保障。益畅是片剂(压片糖果)：优点是便携、免冲泡，咀嚼食用方便。益顺是粉剂(固体饮料):可以用40°C以下温水冲饮或直接干吃。'

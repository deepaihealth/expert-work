    如果是体内缺少γ-氨基丁酸等有益菌产物，而引起失眠，或者是近几天有烦心事才睡不好的人，可能吃完当天或者不到一周就能睡很好；

    如果是长期失眠甚至已经引起情绪异常和身体问题，肯定是需要长期调理来改善的，建议至少调理1~3个月，这个期间会有逐步改善的感觉，不可操之过急。

    益休益生菌适合当做“放松补品”“助眠帮手”，但不能当做“药物”。'

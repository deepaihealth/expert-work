  - document: 华大营养益生菌FAQ-2026.xlsx
    anchor: 通过食养调理的方式帮助身体清酸、抗氧化以及提升代谢健康
    page: null
    via: pool-judge
  answer: '肠道微生态系统参与机体嘌呤和尿酸代谢，已被大量研究证实。高嘌呤饮食可导致肠道微生态失衡，继而加重嘌呤和尿酸代谢异常，使尿酸水平升高，并引起痛风的发生、发展。既然肠道微生态系统是嘌呤、尿酸代谢的重要环节，那么通过补充益生菌就可以起到预防或改善高尿酸血症及痛风的作用。

    清风作用机理：

    （1）干酪乳杆菌→减少嘌呤吸收；

    （2）薏苡仁高良姜酶解物、海洋鱼多肽→抑制尿酸生成；

    （3）酸樱桃提取物、鼠李糖乳杆菌、发酵粘液乳杆菌BGI-AF16→促进尿酸排出

    （4）整体组合：维持肠道内环境稳态。益生菌能够促进肠道蠕动，提高胃肠道动力，肠道中酸性物质的排泄发挥重要作用。

    （5）整体组合：调节机体免疫功能。痛风发作属于人体异常的免疫应答，而肠道是人体最大的免疫器官，益生菌可以调节肠道内的免疫活性物质的表达，从而到增强人体免疫力，改善痛风的作用。'

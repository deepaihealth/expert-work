- id: faq_xlsx-0065
  query: 益舒营养指导
  source: faq_xlsx
  tags:
  - 益舒
  expected:
  - document: 华大产品汇总.xlsx
    anchor: 适度体育锻炼，可以选择太极拳、太极剑、气功等节奏和缓的非竞技体育项目，每周体育活
    page: null
  - document: 华大营养益生菌FAQ-2025.xlsx
    anchor: 适度体育锻炼，可以选择太极拳、太极剑、气功等节奏和缓的非竞技体育项目，每周体育活
    page: null
  - document: 华大营养产品知识库.xlsx
    anchor: 适度体育锻炼，可以选择太极拳、太极剑、气功等节奏和缓的非竞技体育项目，每周体育活
    page: null
  answer: "养胃护胃小妙招，胃真舒心\n1.起居：注意生活作息，起居规律。适度体育锻炼，可以选择太极拳、太极剑、气功等节奏和缓的非竞技体育项目，每周体育活动时间≥4h。 \n2.饮食：调节饮食习惯，定时、定量用餐，忌暴饮暴食。食物要清淡、少油腻、稀软碎烂，干稀搭配、易消化为主，减少对胃黏膜的刺激。不宜食用产气多食物如马铃薯、面食、豆类，高脂肪食物等，难消化的食物如炸糕、油饼、玉米饼、糯米年糕以及凉拌菜等，忌油炸、腌制、烧烤、生冷、辛辣。避免不规律的进食、进食生冷食物频率≥3次/周、进食甜食频率≥3次/周、进食辛辣刺激食物频率≥3次/周等。\n3.细嚼慢咽：让食物充分磨碎与胃液充分混合，尽量减少胃部负担，发挥唾液的功能，使唾液中的消化酶入胃后中和胃酸，降低胃酸浓度。\n4.心理：保持心理健康，避免悲观、焦虑情绪，适当参与集体活动，多与他人交流，学会自我调节及护理。保证充足的睡眠，避免每周失眠次数≥3次。\n5.服药：尽量减少服用引起消化不良的药物，如抗生素、非甾体类抗炎药等。\n6.如出现黑便、消瘦等报警症状时，建议进一步检查。"

  expected:
  - document: 产品说明书 ：益家人.docx
    anchor: 优美达益衡益生菌产品采用“四大华大专研糖友益生菌+专配益生元 + 药食同源植物成
    page: null
  - document: 产品说明书 ：晚安饮.docx
    anchor: '**答：**多数人服用益生菌后不会出现明显不良反应，可能仅感觉肚子有“咕噜”声或'
    page: null
  - document: 产品说明书 ：益休.docx
    anchor: '**答：**多数人服用益生菌后不会出现明显不良反应，可能仅感觉肚子有“咕噜”声或'
    page: null
  - document: 话术.docx
    anchor: 益家人是一款专为肠道健康设计的复合益生菌
    page: null
    via: pool-judge
  answer: '优美达益衡益生菌产品采用“四大华大专研糖友益生菌+专配益生元 + 药食同源植物成分 ”三重复合配方，从阻（竞争性抑制 α‑淀粉酶、α-葡萄糖苷酶，阻断淀粉、葡萄糖的吸收）、促（激活AMPK 和 AKT 代谢通路，促进能量消耗，促进人体自身 GLP-1 与胰岛素分泌，促进短链脂肪酸生成，提升胰岛素敏感性）、衡稳（调节肠道菌群失衡，修复肠道屏障，缓解慢性炎症，减轻胰岛素抵抗，稳住血糖波动），最终把血糖曲线从‘过山车’变成‘平缓步道’。


    **益生菌吃完后会拉肚子或者其他副作用吗？**


    **答：**多数人服用益生菌后不会出现明显不良反应，可能仅感觉肚子有“咕噜”声或排气略多。但对于肠道菌群已严重失调的人群，在服用初期（特别是前1-4周），可能出现症状暂时加重的情况，如便秘、腹痛、腹泻、胀气或皮肤痘痘增多。


    这主要是因为发生了**“赫氏消亡反应”**。（1）人体补充益生菌，益生菌必须与有害菌战斗，最终打败有害菌；有战争就会有伤害；（2）在开始服用益生菌的 1-4 周内，益生菌与有害菌进行惨烈的战争，包括竞争营养、抢夺生存空间、竞争能在肠道壁上附着的位置；双方的死亡量都较大。有害菌死亡时会释放大量毒素和其他新型的代谢产物来对抗有益菌，而这些毒素在对抗有益菌的同时，**也对人体产生了“好像病情加重的”症状；**（3）这些症状的反应不是因为服用益生菌，而是因为已经占据体内肠道的有害菌引起，这些反应其实是一个好的信号，说明益生菌已经发挥作用，有害菌正在死亡，坚持服用益生菌或者增加食用量，相当于在战争中不断补充援军，益生菌会逐渐占领上风，最终打败有害菌；（4）赫氏消亡反应通常时间不长，大多数人几天至 2 周就会消失，个别严重者会持续到 4周，然后转向身体康复阶段。菌群失调越严重，赫氏反应可能越大。'

    page: null
  - document: 产品说明书 ：益休.docx
    anchor: '**如都排除后可考虑身体适应期“赫氏消亡反应”，**产品中的益生菌正在改变肠道内'
    page: null
  - document: 产品说明书 ：益衡（血糖管理）.docx
    anchor: '**如都排除后可考虑身体适应期“赫氏消亡反应”，**产品中的益生菌正在改变肠道内'
    page: null
  answer: 需要详细了解自身情况再综合判断，主要关注几个方面，是否用药；是否食用高糖高碳水食物等影响血糖因素；是否作息不规律熬夜等这些外在因素影响；服用量不够或太多。**如都排除后可考虑身体适应期“赫氏消亡反应”，**产品中的益生菌正在改变肠道内的菌群平衡。当“好菌”与“坏菌”竞争时，死亡的“坏菌”可能会释放毒素，新生的“好菌”也在建立新的生态。这种反应通常是暂时的，可能在持续服用几天到1-2周后自行消失，随后身体会逐渐适应并向好的方向发展。建议坚持食用至少 4–8 周，每天按营养师指导说明食用。增加系统监测，如记录尿酸情况，观察趋势。配合低嘌呤饮食、规律有氧运动（如快走、骑行），并控制总热量摄入。
- id: manual_qa-0092
  query: 清风益生菌与降尿酸药物的区别？
  source: manual_qa
  tags:
  - 清风
  expected:
  - document: 产品说明书 ：清风（尿酸管理）.docx
    anchor: 清风益生菌产品通过多靶点作用，调节肠道菌群平衡，优化尿酸的生成与排泄路径，主要作
    page: null
  answer: 清风益生菌产品通过多靶点作用，调节肠道菌群平衡，优化尿酸的生成与排泄路径，主要作用于肠道，减少尿酸的再吸收，抑制黄嘌呤氧化酶（XOD），并通过修复肠道屏障降低系统性炎症，基本无副作用，主要成分为益生菌和药食同源植物，对肝肾无负担。 降尿酸药物 (如非布司他、别嘌醇、苯溴马隆)主要是通过抑制黄嘌呤氧化酶（如别嘌醇）或促进肾脏排泄（如苯溴马隆），强行阻断体内尿酸合成酶，或强行打开肾脏排泄通道，存在明确副作用风险可能伤肝、伤肾、引起严重皮疹（超敏反应）等。

    anchor: 益生菌的功效取决于具体的菌株，有的菌株可以减肥，有的菌株可以增肥，如果吃错了，可
    page: null
  answer: '益生菌的功效取决于具体的菌株，有的菌株可以减肥，有的菌株可以增肥，如果吃错了，可能起到相反的作用，因此，建议选择有相关研究的菌株，益动里添加的格氏乳杆菌TF08（专利菌株，就可以有控糖效果），并且有300亿的活菌添加量，帮助调节肠道菌群。其次，增加了5种益生元（⽔溶性膳⻝纤维（聚葡萄糖）、乳糖醇、低聚半乳糖、低聚果糖、抗性糊精），这些食物才是有益菌的“能量源泉”，能使其在肠道内更好地定植，并起到减肥的作用。最后还添加了栗子粉和海藻粉，协同改善代谢。

    吃益生菌的同时建议保持健康的生活方式，适量的运动，都能够促进肠道内环境向着利于有益菌生存的环境改变，促进肠道微生态系健康。'

- id: manual_qa-0016
  query: 为什么镜脂轻益生菌能减肥降脂？
  source: manual_qa
  tags:
  - 镜脂轻益生菌
  expected:
  - document: 产品说明书：镜脂轻（体重管理）.docx
    anchor: 镜脂轻益生菌产品采用“六大华大自研减负菌+五重专属益生元+四维植萃纤维阻隔”三重
    page: null
  answer: 镜脂轻益生菌产品采用“六大华大自研减负菌+五重专属益生元+四维植萃纤维阻隔”三重复合配方，6株核心“减负菌”（格氏乳杆菌TF08-1、动物双歧杆菌乳亚种BGI-N3、乳酸片球菌BGI-N9、戊糖片球菌BGI-N8、植物乳植杆菌BGI-N6、鼠李糖乳酪杆菌OF44）重塑肠道微生态结构，显著提升“瘦子菌”（如拟杆菌门）丰度比例，从源头激活脂质代谢通路，帮助身体切换至“易瘦体质”模式。5大专属益生元（聚葡萄糖、低聚半乳糖、低聚果糖、抗性糊精、乳糖醇）则是核心菌株的“定向燃料”，协同增殖好菌并延长饱腹信号。菠菜粉、海藻粉、栗子粉、柑橘纤维复合植物成分：这些成分构建了物理级的“热量防线”，利用天然纤维的吸附膨胀特性，不仅高效抑制食欲、减少热量摄入，更能像海绵一样包裹肠道内的多余油脂与代谢废物，加速排浊，实现“控入排它”的身体轻盈感。

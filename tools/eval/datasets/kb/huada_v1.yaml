  answer: '人出生后免疫系统持续的发育与成熟，需要不断地接受外界抗原的刺激，在接触各种抗原过程中如感染、疫苗、肠道菌群的“沟通”等，在不断磨练和学习的过程中，才能逐渐成为“成熟稳重”的免疫系统。

    以上因素中，肠道菌群是最重要的微生物刺激来源，是驱动免疫系统发育成熟，甚至是诱导免疫平衡的基本因素，影响人体长期免疫平衡。

    现代多项临床研究已发现，过敏性疾病和某些自身免疫性疾病的发病率增高，与肠道菌群紊乱导致的免疫反应异常相关。食物过敏患者肠道菌群存在失调现象，通过恢复肠道菌群平衡，能有助于免疫功能“拨乱反正”，减少免疫下降或过激的情况。'

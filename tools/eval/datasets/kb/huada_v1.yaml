    anchor: 在人的一生中，肠道平均要处理65吨食物和饮料，相当于处理了12头大象，而且人体9
    page: null
  answer: 在人的一生中，肠道平均要处理65吨食物和饮料，相当于处理了12头大象，而且人体99%的营养物质都由肠道吸收。在人体肠道微生态系统中，已知细菌种类有1000余种，这些细菌参与了人体的营养代谢、免疫等多种生理活动，和人体的健康息息相关。研究显示，肠道菌群参与了营养物质的吸收、能量调节和脂肪储存。肠道菌群失衡是肥胖人群的主要特征，同时也是发病原因之一，二者互为因果。

    page: null
  - document: 华大营养益生菌FAQ-2025.xlsx
    anchor: 少数人刚开始摄入益生菌产品后，会觉得有轻微的肠道不适，如排便次数增加/减少、排气
    page: null
  - document: 华大营养产品知识库.xlsx
    anchor: 少数人刚开始摄入益生菌产品后，会觉得有轻微的肠道不适，如排便次数增加/减少、排气
    page: null
  answer: 不会。少数人刚开始摄入益生菌产品后，会觉得有轻微的肠道不适，如排便次数增加/减少、排气增加等，这是由于很多人存在肠道菌群紊乱、肠道有炎症或肠道早衰，肠道比较敏感，而益生菌与有害菌“斗争”的过程比较激烈，杀菌物质和坏菌死亡后释放的有害物质有一定刺激性，可能会造成轻微不适，这是正常现象，不是加重肠道症状。可以适当调整饮食、增加饮水，适当增加/减少益生菌食用频率，完全不用担心会造成损害。
- id: faq_xlsx-0006
  query: 食用益生菌的注意事项有哪些？
  source: faq_xlsx
  tags:
  - 益生菌通用
  - 益生菌
  expected:
  - document: 华大产品汇总.xlsx
    anchor: 抗生素能够杀灭人体内的细菌，破坏肠道菌群平衡，通过补充益生菌可以恢复肠道菌群平衡
    page: null
  - document: 华大营养益生菌FAQ-2025.xlsx
    anchor: 抗生素能够杀灭人体内的细菌，破坏肠道菌群平衡，通过补充益生菌可以恢复肠道菌群平衡
    page: null
  - document: 华大营养产品知识库.xlsx
    anchor: 抗生素能够杀灭人体内的细菌，破坏肠道菌群平衡，通过补充益生菌可以恢复肠道菌群平衡
    page: null
  answer: '(1)切忌与抗生素同时服用。抗生素能够杀灭人体内的细菌，破坏肠道菌群平衡，通过补充益生菌可以恢复肠道菌群平衡，但是两者服用的时间最好间隔两个小时以上，否则抗生素会将益生菌杀死，导致益生菌失效。

    (2)切忌用热开水送服。由于益生菌在水温超过40C时会失去生物学活性，因此益生菌粉剂、片剂一般需要用不高于40℃的温水送服。

    (3)切忌与吸附类药物同时服用。吸附类药物是能有效地从气体或液体中吸附某些成分，像细菌、病毒等，但是这类药物会减少其他药物的吸收。蒙脱石散是一种吸附剂，与益生菌联用会导致益生菌被吸附，不利于益生菌在肠道内的定植、繁殖:还有铋剂、鞣酸、药用炭等都有吸附活菌的能力，与益生菌同时服用也会影响益生菌的疗效。需要间隔一定时间再进行服用。

    (4)冲泡后应尽快服用。菌粉中的益生菌原本处于休眠状态，遇水则复活，冲泡之后久置会导致益生菌被氧化而失活，影响益生菌产品的使用效果。

    (5)饭后半小时后服用为宜（除清风、益舒特殊场景）。饭后半小时到一小时，食物可以中和胃酸和胆汁，降低两者浓度，此时再服用益生菌能够保证效果。'
- id: faq_xlsx-0007
  query: 吃益生菌后症状加重了？
  source: faq_xlsx
  tags:

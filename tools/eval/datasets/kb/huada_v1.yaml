- id: faq_xlsx-0113
  query: 清风营养指导
  source: faq_xlsx
  tags:
  - 清风
  expected:
  - document: 产品说明书 ：清风（尿酸管理）.docx
    anchor: 3.限制脂肪摄入：可减少尿酸排泄，应适量限制，并用蒸、煮、炖、卤、煲、焯等用油少
    page: null
  - document: 华大产品汇总.xlsx
    anchor: 1.适宜能量：如超重肥胖应适当减重，减少能量应循序渐进，切忌骤碱，否则引起体脂分
    page: null
  - document: 华大营养产品知识库.xlsx
    anchor: 1.适宜能量：如超重肥胖应适当减重，减少能量应循序渐进，切忌骤碱，否则引起体脂分
    page: null
  answer: '生活小技巧，无酸一身轻

    1.适宜能量：如超重肥胖应适当减重，减少能量应循序渐进，切忌骤碱，否则引起体脂分解过快会导致酮症，抑制尿酸的排出，诱发痛风症急性发作；

    2.适量蛋白质：适量限制蛋白质供给可控制嘌呤的摄取。优质蛋白质优先选用乳类、干酪、鸡蛋等。其次适量的肉、鱼、禽类等，肉类烹饪前煮沸弃汤可除去部分嘌呤；

    3.限制脂肪摄入：可减少尿酸排泄，应适量限制，并用蒸、煮、炖、卤、煲、焯等用油少的烹调方法；

    4.适量供给碳水化合物：碳水化合物有抗生酮作用和增加尿酸排泄的倾向，故应是能量的主要来源，约占总能量的55%-65%。但果糖（主要来源）会增加痛风的风险，应减少其摄入量；

    5.充足维生素和矿物质 各种维生素，尤其是B族维生素和维生素C应足量供给，含B族和C族丰富的食物主要为全谷类、橘类水果、绿色蔬菜；

    6.少吃盐：通常用量2-5g/d。

    7.多喝水：每天摄人充足的水分有利于体内尿酸的排出，只要肾功能正常，每天饮水达到2000m以上，约8-10杯水，伴肾结石者最好达到3000ml。睡前或夜间亦应补充水分以防止尿液浓缩。水分摄人应以白开水、淡茶水、矿泉水等为主。

    8.戒酒：酒精不仅增加尿酸合成，而且使血乳酸浓度升高，抑制肾小管分泌尿酸，造成肾脏排泄酸减少。近年来研究发现，痛风与饮酒的相关性不仅与酒量有关，而且与酒的类型也有关。啤酒与痛风的相关性最强，烈酒次之；

    9.适当运动：适当的运动可预防痛风的发作，减少内脏脂肪，减少胰岛素抵抗，运动的种类包括散步、游泳、健美操、太极及羽毛球等有氧运动。注意需避免与体力不相称的剧烈运动。因剧烈运动是无氧运动，可产生大量乳酸与尿酸竞争排泄，同时由于肌肉ATP的分解加速而导致尿酸生成增加；

    10.培养良好的饮食习惯：一日三餐应有规律，也可少食多餐。忌暴饮暴食或随意漏餐。烹饪方法也应注意，一些调味品如辣椒、胡椒、芥末及生姜等能兴奋自主神经诱导痛风急性发作，故烹饪时应尽量避免或少使用；

    11.避免高嘌呤食物：尽管高尿酸血症的发生主要是自于内源性代谢紊乱所致，但高嘌呤饮食可使血尿酸浓度升高，甚至达到痛风患者的水平，常可造成急性痛风性关节炎的发作。一般人日常膳食嘌呤摄入量为600-1000mg。在急性期应严格限制嘌呤摄入少于150mg/d，可选择嘌呤含量低的食物。在缓解期，可适量增选嘌呤含量中等的食物，确保正常平衡膳食。无论在急性期还是在缓解期，均应避免嘌呤含量高的食物。'

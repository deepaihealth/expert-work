    anchor: 便秘和肠内微生态有着密切的联系，肠道内菌群既可以诱发便秘，也能借助便秘产生各种危
    page: null
  - document: 产品说明书：益畅（珠峰版）.docx
    anchor: 益生菌分解益生元，生成有机酸，进而降低肠道pH值，促进肠道蠕动；
    page: null
    via: pool-judge
  answer: '便秘和肠内微生态有着密切的联系，肠道内菌群既可以诱发便秘，也能借助便秘产生各种危害机体的物质。现代医学研究证实，长期便秘会诱发不同的疾病而导致人体提早老化。粪便长期积存在肠道中，使有害菌大量繁殖，产生的有害物质进入循环代谢，引起机体多个器官的损害。

    华大自有益生菌调节肠道菌群，对缓解便秘有着较好的效果。便秘人群在服用益畅时，含有的益生菌在体内生长代谢过程中产生多种有机酸，使肠腔pH下降，电势降低，进而调节肠道的正常蠕动，缓解便秘症状。同时产生的有机酸还可使肠腔内渗透压增高、水分分泌增加，粪便中水分增多可缓解便秘。且大量研究证实，益生元、合生元均有缓解便秘的效果，宜于长期服用，且无依赖性，所以益畅可以有效改善有望便秘。'

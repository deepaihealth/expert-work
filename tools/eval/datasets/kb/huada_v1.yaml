  answer: 益生菌和乳酸菌定义和内涵不同。人类健康领域的益生菌通常是指活的微生物，当给予或摄入充足数量时，对人体产生一定的健康益处。乳酸菌则是指能发酵糖类并产生乳酸的细菌的总称，不是一个严格的微生物分类名称。并非所有的乳酸菌都是益生菌。有些奶制品或肉制品发酵菌种(比如嗜热链球菌、乳酸乳球菌等)仅是作为食品发酵剂使用，产生风味和产生食品的质构。因此要补充益生菌的话，建议是通过服用益生菌产品来获得。

- id: faq_2026-0009
  query: 为什么吃益动反而胖了？
  source: faq_2026
  tags:
  - 镜脂
  expected:
  - document: 华大产品汇总.xlsx
    anchor: 有害菌为了存活会释放比平时更多的毒素，或者通过改变代谢途径生成新毒素来对抗益生菌
    page: null
  - document: 华大营养产品知识库.xlsx
    anchor: 有害菌为了存活会释放比平时更多的毒素，或者通过改变代谢途径生成新毒素来对抗益生菌
    page: null
  - document: 华大营养益生菌FAQ-2026.xlsx
    anchor: 有害菌为了存活会释放比平时更多的毒素，或者通过改变代谢途径生成新毒素来对抗益生菌
    page: null
  answer: '首先评估饮食、生活方式、精神压力有无变化，以及激素水平如甲状腺激素等有无问题。（从各个方面来分析原因，给到客户建议）

    第一：出现体重增加的现象，叫作赫氏消亡反应。出现该症状是因为在人体消化系统中，益生菌和有害菌正在展开剧烈的斗争。有害菌为了存活会释放比平时更多的毒素，或者通过改变代谢途径生成新毒素来对抗益生菌。而这些毒素在作用于益生菌的同时，也使人体出现了副反应，导致了一系列症状。所以这些副反应不是来自益生菌，而是来自已经占据体内肠道的那些有害菌。有时这些副反应反倒是一个好信号，说明益生菌已发挥作用，有害菌正在消亡。随着坚持服用益生菌，病情就会逐渐好转，益生菌逐渐战胜有害菌，直至身体完全建复。所以，有人形象地说赫氏消亡反应是“治愈疾病过程中黎明前的黑暗”。

    第二：肠道菌群在恢复平衡的过程中，会增加营养物质的消化吸收，因此如果这个过程中饮食结构不均衡比如摄入过多的碳水化合物而蛋白质摄入过少，也会出现体重增加的情况。

    肠道菌群自3岁后基本与成人肠道菌群结构相似，因此在长达几十年的过程中，我们的菌群是一个非常稳固的结构，短短一两个月很难去实现根本性改变，因此需要时间和量来等待其慢慢改变，因此我们建议这个干预周期至少是3-6个月，甚至更久。在这个过程中，如果想追求很快的效果，建议加上轻路膳食纤维粉，一方面可以补充益生元，让我们益动里的益生菌在肠道内长的更好，更快来发挥作用；一方面具有一定饱腹感，可以帮助我们进行热量的控制。'

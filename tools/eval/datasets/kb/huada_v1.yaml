    page: null
    via: pool-judge
  answer: '在补充益生菌的同时，采取6个小妙招可以进一步促进益生菌在肠道中的作用，帮助它们更快地发挥作用。**


    （1）定时排便：晨起或餐后2小时内是排便佳时，专心排便，勿超10分钟。


    （2）足量饮水：晨起空腹喝温水，保证每日饮水量1.5-2升。


    （3）多吃纤维：多摄入富含纤维的蔬菜（如菠菜、芹菜）、水果（如木瓜、梨）以及粗粮（如玉米、糙米），以增加粪便体积。


    （4）补充维生素B1：维生素B1摄入不足会影响神经传导，减缓胃肠蠕动速度，进而不利于食物的消化、吸收和排泄。多吃富含维生素B1的食物，如麦麸、粗粮、蔬菜、豆类及其制品。


    （5）勿憋便意：一旦有便意，应及时排便，以免错过排便信号。


    （6）保持好心情：及时调整焦虑等负面情绪，有助于肠道健康。'

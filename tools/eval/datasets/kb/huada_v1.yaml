- id: faq_xlsx-0037
  query: 益畅营养指导
  source: faq_xlsx
  tags:
  - 益畅
  expected:
  - document: 华大产品汇总.xlsx
    anchor: 1.养成定时排便的习惯：睡醒和餐后肠道运动能力强，最容易把粪便排出体外，建议晨起
    page: null
  - document: 华大营养益生菌FAQ-2025.xlsx
    anchor: 1.养成定时排便的习惯：睡醒和餐后肠道运动能力强，最容易把粪便排出体外，建议晨起
    page: null
  - document: 华大营养产品知识库.xlsx
    anchor: 1.养成定时排便的习惯：睡醒和餐后肠道运动能力强，最容易把粪便排出体外，建议晨起
    page: null
  answer: '6个小妙招 排便通畅无忧

    1.养成定时排便的习惯：睡醒和餐后肠道运动能力强，最容易把粪便排出体外，建议晨起或餐后2小时内尝试排便，排便时集中注意力，不玩手机；每次排便时间不宜过长（＜10分钟/次）——短期内不一定有效果，但长期坚持有帮助哦；

    2.多喝水：晨起空腹饮1~2杯温水，每日喝水量为1.5L-2L；

    3.适当锻炼：避免久坐不动，可选择散步、做操等方式；

    4.增加高膳食纤维食物，避免进食过少或食物过于精细，导致对肠道刺激减弱，高膳食纤维在肠道中吸收水分，增加粪便体积和重量，刺激肠道蠕动，推进粪便排出。富含膳食纤维的食物有蔬菜、水果和粗粮，如菠菜、芹菜、韭菜、豆芽、萝卜、芥兰、黄瓜等，新鲜水果如香蕉、木瓜、蓝莓、杨桃、金桔、梨等，粗粮可采用玉米、小米、黑米、糙米以及各种杂豆等，必要时可吃魔芋糕、果胶冻等。

    5.增加维生素B1的摄入：维生素B1摄入不足可影响神经传导，减缓胃肠蠕动，不利于食物的消化、吸收和排泄。多吃富含维生素B1的食物，如麦麸、粗粮、蔬菜、豆类及其制品。

    5.不要憋便，一有便意时及时排便；

    6.出现负面情绪时，及时调整心理状态。'

- id: faq_xlsx-0047
  query: 畅青营养指导
  source: faq_xlsx
  tags:
  - 畅青
  expected:
  - document: 产品说明书：畅青.docx
    anchor: 可供参考的限制食物种类包括：富含FODMAPs（即难吸收的短链碳水化合物，如果糖
    page: null
  - document: 华大产品汇总.xlsx
    anchor: 可供参考的限制食物种类包括：富含FODMAPs（即难吸收的短链碳水化合物，如果糖
    page: null
  - document: 华大营养产品知识库.xlsx
    anchor: 可供参考的限制食物种类包括：富含FODMAPs（即难吸收的短链碳水化合物，如果糖
    page: null
  answer: '养肠小技巧，不再是容易闹脾气的小肠子了

    1.调整饮食：定时定量，避免或减少刺激性或不耐受食物。可供参考的限制食物种类包括：富含FODMAPs（即难吸收的短链碳水化合物，如果糖、乳糖）等成分的食物（如苹果、梨、芒果、西瓜、蜂蜜、全脂牛奶、芦笋、西兰花、卷心菜等）；高脂肪、辛辣、麻辣和重香料的食物；高膳食纤维素食物可能对便秘有效（但对腹痛和腹泻不利）；寒凉食物可能会加重腹泻；一旦明确食物过敏原，应避免摄入含有该过敏原成分的食物；

    2.对于明确麦麸过敏或乳糜泻患者，需进行无麸质饮食，如马铃薯、玉米、蔬菜、肉类、豆类、坚果、乳蛋、海鲜、米类等，或购买标示无麸质的食品，戒断含有麦麸的食物，如意大利面、披萨、啤酒、燕麦、吐司、三明治等，甚至酱料、蛋糕、面包、饼干与蛋糕等食物；

    3.急性腹泻期，可暂时禁食，使胃肠道完全休息，待腹泻稍有好转时可吃清淡流食，如浓米汤、藕粉等（暂不喝牛奶、豆浆）少量多餐；大便次数减少后，可耻蒸蛋羹、布丁、酸奶、豆腐、浓米汤甩蛋花等，继而过渡到少渣低脂半流食，可吃鸡肉米粥、薄面片、鱼羹、胡萝卜泥、土豆泥、肝泥等；恢复期，建议减少对肠道的刺激，不吃太多高纤维、产气多的蔬菜、水果和粗粮，如生葱蒜、芹菜、韭菜、豆芽等，可吃少量含纤维少的如冬瓜、茄子、胡萝卜、去皮西红柿、嫩碎菜叶、南豆腐等。禁食油炸食品和过多烹调油。食物温度不宜过冷，以免刺激刺激肠蠕动。在逐渐过度到正常饮食；

    4.慢性腹泻期，平常吃易消化的谷类食物，如粥类、挂面、面片、面包类，多选用低脂易消化的高蛋白质食品，如鸡蛋、鱼、鸡肉、瘦肉、低脂牛奶以及豆腐等。少吃或不吃含纤维高的蔬菜、水果和粗粮，可选用蔬菜的嫩叶或含纤维较少的瓜类，如冬瓜、茄子、胡萝卜、去皮西红柿等。烹调时少用油，多用蒸、煮、炖、烩等方法。少量多餐，一日6~7次；

    5.如伴有腹痛者，吃饭要细嚼慢咽，防止吞气太多；避免或少食增加产气的食物，如黄豆、豌豆、荷兰豆、卷心菜、菜花、黄瓜、甘蓝、辣椒、萝卜、大葱、青葱、洋葱、大蒜、韭菜、西瓜、甜瓜等；

    5.养成良好的生活和工作习惯，注意气候、季节、时差等因素的影响；

    6.调整睡眠，解除心理负担，缓解焦虑，适当锻炼。'

    anchor: 正所谓“有人在的地方就有江湖”，而女性的阴道内因含有大量各种各样的微生物种群，同
    page: null
  answer: 正所谓“有人在的地方就有江湖”，而女性的阴道内因含有大量各种各样的微生物种群，同样也形成了一个小小的微生态“江湖”。如同武侠小说中的江湖一样，阴道里的各类菌也会“拉帮结派”，土著帮派主要包括乳杆菌、加德纳菌、大肠杆菌、消化链球菌、支原体及假丝酵母等。它们主要落户于阴道四周的侧壁黏膜褶皱中，其次在穹窿部，部分在宫颈。这些微生物在阴道内生长繁殖，免不了“打打杀杀”，此时“根正苗红”的乳杆菌(益生菌)作为主力菌，通过产生乳酸、过氧化氢(H2O2)和一些酶等，维持阴道正常酸性环境(阴道正常pH为3.8~4.5)，从而抑制其他寄生菌的过度生长，维持阴道的微生态平衡，成为众菌不得不服的“正义大菌”。然而，乳杆菌的兴盛还受雌激素的影响，雌激素使阴道上皮增生变厚，细胞内的含糖量增加，也为乳杆菌提供制作乳酸的原料。随着雌激素的消退，阴道中的乳杆菌也相应减少。总之，在这个小“江湖”里，宿主和菌群之间、菌群与菌群之间相互制约、相互依赖，保持着动态平衡，当这一平衡被打破时，阴道炎等麻烦随之而来。

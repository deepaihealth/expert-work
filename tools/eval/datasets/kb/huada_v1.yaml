    page: null
  answer: '那些让你“肝劲满满”的小妙招

    1、每天至少40分钟的有氧运动。比如快走、慢跑、游泳等。日常饭后散步、家务、购物等，加起来能超过一万步的话，坚持较长时间也有一定效果。


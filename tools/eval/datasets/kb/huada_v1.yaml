    anchor: 对于阴道炎的治疗主要为三步:一抗菌(抗生素驱逐致病病原体)，二修复(修复受损的阴
    page: null
  - document: 华大营养产品知识库.xlsx
    anchor: 对于阴道炎的治疗主要为三步:一抗菌(抗生素驱逐致病病原体)，二修复(修复受损的阴
    page: null
  answer: 对于阴道炎的治疗主要为三步:一抗菌(抗生素驱逐致病病原体)，二修复(修复受损的阴道黏膜)，三恢复(请外援益生菌恢复阴道微生态，其实就是缺啥补啥)。看似不重要的第三步，却在治疗效果中起决定性作用。同土著益生菌一样，外援益生菌(目前大多是乳杆菌)主要通过维持阴道酸性环境及产生多种抑菌物质杀灭多种病原微生物，同时形成阴道黏膜的“保护伞”，阻止病原微生物的入侵;大量定植于阴道中的外援乳杆菌再次成为微生态中的优势菌，制约其他菌群。所以，对于阴道炎的治疗，修复阴道内环境、平衡内分泌，益生菌的使用必不可少。

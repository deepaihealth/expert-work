  answer: 甘油二酯油是油脂的一种天然成分，也存在于天然油脂中，但含量通常较低。它是由一个甘油分子和两个脂肪酸分子构成。，长期使用对高血脂高尿酸、高血糖、高体脂有显著改善作用，30多年来全球有100+国际权威科学家及机构功效验证，制备技术荣获国家科学进步奖

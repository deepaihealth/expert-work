    4、增加优质蛋白质摄入，如瘦肉、蛋类、奶类、大豆制品，优先选择蒸、煮、清炖的烹调方式。

    5、每周饮食基本都能做到：每天吃新鲜蔬菜和水果，至少有1天不吃红肉，至少有4天会吃豆类，至少有1天会吃鱼类

    6、保持体重指数（BMI）小于28，男性腰围＜90 cm，女性腰围＜85 cm。

    7、不盲目节食，保证每日机体的热量需求。

    8、药物和保健品需在专业人士指导下使用，日常调理优先选择食补。

    9、减少熬夜，早睡早起，成年人需保证每日7-9小时睡眠。'

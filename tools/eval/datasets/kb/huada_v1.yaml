    anchor: 丁酸是肠道的直接供能物质，可促进肠黏膜的生长和修复，增强肠道免疫功能，促进有益菌
    page: null
  answer: 通过对痛风患者的研究发现:一方面，其体内的丁酸合成大大降低。丁酸是肠道的直接供能物质，可促进肠黏膜的生长和修复，增强肠道免疫功能，促进有益菌、抑制致病菌的生长。另一方面，肠道有益菌代谢产生的黄嘌呤脱氢酶可降低痛风患者体内的嘌呤含量，尿囊素酶可以降低痛风患者排泄的尿酸的量。因此，肠道菌群失衡导致痛风发病，可能是因为黄嘌呤脱氢酶和有益菌的相对缺乏，导致尿酸代谢出现障碍，血中尿酸增加。

    page: null
  answer: 优美达清风益生菌产品采用“四大华大专研清风益生菌+专配益生元 + 药食同源植物成分 ”三重复合配方，发酵粘液乳杆菌 BGI-AF16 基因组中包含尿酸氧化酶基因，能直接在肠道内将尿酸分解掉，4株清风菌（干酪乳杆菌 LCS85、鼠李糖乳酪乳杆菌OF44、发酵粘液乳杆菌BGI-AF16、罗伊氏粘液乳杆菌BGI-AM60）则是从源头“吃掉”产生酸的原料（核苷等），减少合成底物。酸樱桃浓缩粉、海洋鱼多肽、薏苡仁高良姜酶解物复合植物成分： 这些成分含有天然的生物活性物质，能抑制黄嘌呤氧化酶的活性，阻碍多余尿酸合成，从而抑制酸值升高。酸樱桃浓缩粉亦有促进肾脏排泄的作用，且能抗炎缓解关节痛。

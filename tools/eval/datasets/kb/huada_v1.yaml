    anchor: '**如都排除后可考虑身体适应期“赫氏消亡反应”，**产品中的益生菌正在改变肠道内'
    page: null
  answer: 需要详细了解自身情况再综合判断，主要关注几个方面，是否用药；是否饮用咖啡、浓茶等影响睡眠的饮食因素；是否白天睡眠时间过长；是否周边环境改变没有条件创造优质睡眠环境；自身情绪是否比较焦虑等这些外在因素影响；服用量不够或太多。**如都排除后可考虑身体适应期“赫氏消亡反应”，**产品中的益生菌正在改变肠道内的菌群平衡。当“好菌”与“坏菌”竞争时，死亡的“坏菌”可能会释放毒素，新生的“好菌”也在建立新的生态。这个“肠道战争”的过程可能会通过“肠-脑轴”暂时性地影响您的神经系统，表现为焦虑、烦躁、腹胀或睡眠障碍。这种反应通常是暂时的，**可能在持续服用几天到1-2周后自行消失，随后身体会逐渐适应并向好的方向发展。**

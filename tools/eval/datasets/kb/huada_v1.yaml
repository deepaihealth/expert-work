    page: null
  answer: '因为每个人身体状况不同，而且睡眠不好的情况、原因、程度都有差异，所以每个人刚开始吃益休益生菌的感受和改善程度会不同，益休益生菌适合当做“放松补品”“助眠帮手”，但不能当做“药物”。


    1）如果是体内缺少γ-氨基丁酸等有益菌产物，而引起失眠，或者是近几天有烦心事才睡不好的人，可能吃完当天或者不到一周就能睡很好；


    2）如果是长期失眠甚至已经引起情绪异常和身体问题，肯定是需要长期调理来改善的，建议至少调理1~3个月，这个期间会有逐步改善的感觉，不可操之过急，引起焦虑加重睡眠问题。'

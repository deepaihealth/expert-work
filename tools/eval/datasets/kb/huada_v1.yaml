- id: manual_qa-0018
  query: 镜脂轻适合什么人吃？适合孕妇、三高等人群吗？
  source: manual_qa
  tags:
  - 镜脂轻益生菌
  expected:
  - document: 产品说明书：镜脂轻（体重管理）.docx
    anchor: 镜脂益生菌拥有专利菌株和经过人群实证效果，适合3岁以上所有人群（包括三高人群），
    page: null
  answer: 3岁以上均可食用，有减肥体重管理需求的人群适合食用。镜脂益生菌拥有专利菌株和经过人群实证效果，适合3岁以上所有人群（包括三高人群），孕妇、哺乳期也可食用（但是不建议怀孕期间减肥，建议产后进行）。通常情况下益生菌尤其是益生菌食品通常被认为是安全的，但孕期妇女在摄入益生菌时仍需谨慎，因为孕期妇女的免疫系统和新陈代谢会发生变化，这可能会影响益生菌的效果和安全性。补充益生菌可能有助于降低怀孕期间的血糖和胰岛素水平，从而改善健康，降低孕期并发症的风险。2017年和2018年的研究均发现，益生菌对改善胰岛素抵抗和降低血糖和胰岛素水平有积极影响。尽管如此，孕期是一个特殊的时期，每位孕妇的身体状况和营养需求都是独特的。因此，建议孕妇在考虑服用任何益生菌产品，应咨询医生或专业的医疗人员。
- id: manual_qa-0019
  query: 镜脂轻益生菌的减肥原理是什么？吃多久会有效果？大概能瘦多少斤？
  source: manual_qa
  tags:
  - 镜脂轻益生菌
  expected:
  - document: 产品说明书：镜脂轻（体重管理）.docx
    anchor: 目前从我们针对于镜脂轻益生菌配方做的人群实验来看，大概吃了6周有明显见证改变，平
    page: null
  answer: A：主要是从3方面进行体重管理。核心主要是通过直接改善脂代谢，减少外来脂肪吸收，吃进去的脂肪不囤积；调节胆汁酸合成而增加脂肪消耗，加速自身顽固脂肪的分解和代谢。目前从我们针对于镜脂轻益生菌配方做的人群实验来看，大概吃了6周有明显见证改变，平均腰围下降率达1.6cm，持续变化。

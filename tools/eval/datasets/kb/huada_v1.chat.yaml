# B-175 波 2 真实问法集(2026-10-14):题目来自企微客户聊天(三诺 × 华大控糖咨询)里客户问过的问题,
# 脱敏后改写成可单独理解的问法(不留原句、不留个人信息),用户逐题确认。55 道有答案 + 5 道无答案。
# 标准答案 = 人工首标(1~3 份出处)+ 汇集标注:主干 / PR1 的混合、向量、关键词四种检索各取前 20 段
# 汇成候选池(2168 对),qwen3.7-max 逐段判「能否回答」并逐字摘引原文;摘引不是逐字的取最长公共片段
# (≥12 字);问题点了产品名的,段落或文件名须出现该产品(抽查 40 条判「能」错 7 条,多为张冠李戴到
# 别的产品,加此规则后约 92%)。标为 via: pool-judge。无答案题:候选池里无一段被判能回答,并在全语料
# (含 10-13 解析缓存漏掉的文档)核对过关键词。原始聊天与中间文件只在本机 ~/kb-eval/chat/。
# 10-15 补标(T0.5):PR0 / PR1 / PR1+PR2 召回层与带重排结果里排在首个正确段之前的段再判一轮(新增 79 对),
# 同样的摘引与产品名规则(问句同时含长短两个产品名时按更具体的查),另允许同一文档的其他段;抽查 40 条约 36 条对。

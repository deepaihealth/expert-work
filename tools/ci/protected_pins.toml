# 受保护钉版清单 —— PROD-7 / X-14 P2(e2b 事故复盘产物)。
#
# 这里登记的每一行钉版都带着一条真实的兼容性理由(多数对应一次真栈事故或一个
# ROADMAP 迁移项)。CI 卫兵(tools/ci/check_protected_pins.py)断言 `match`
# 子串仍逐字出现在 `file` 里:谁改了钉版(dependabot 或人手滑)而没同步改
# 本清单,CI 立刻红,并把 reason/roadmap 打在失败信息里。
#
# 合法地升级一个钉版 = 同一个 PR 里改依赖 + 改(或删)这里对应的条目,
# 评审因此必然看见理由与迁移项。
#
# 【教训来源】2026-08-21 e2b 事故:dependabot #1233 把 e2b 抬到 2.39.1,钉版
# 注释里写明的兼容性理由(ACS 私有协议 key 过不了新版客户端校验)没有拦住
# 合并,测试环境沙箱工具全灭,真栈才炸。评审可能漏、CI 假件全绿、smoke 只探
# HTTP —— 这道卫兵补的是第二层。

[[pin]]
file = "services/orchestrator/pyproject.toml"
match = '"e2b==2.24.0"'
reason = "e2b 2.25+ 客户端强制校验 key 必须 e2b_ 前缀,ACS Agent Sandbox 私有协议 key 过不了(2026-08-21 真栈事故)"
roadmap = "X-13(升级需重跑沙箱运行时契约探针 + 真栈 exec_python 冒烟)"


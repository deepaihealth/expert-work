# Agent Sandbox pool for expert-work — sandbox migration W1 Task 2.
#
# WHY THIS IS NOT UNDER base/ AND NOT IN A KUSTOMIZATION
# -----------------------------------------------------
# base/kustomization.yaml pins `namespace: expert-work` on everything it
# renders. The W0 PoC that proved sandbox creation works on this cluster
# created its SandboxSet in `default`, and nothing yet tells us whether the
# sandbox-gateway (which lives in `sandbox-system`) discovers pools across
# namespaces. W1 Task 3 is a GO/NO-GO gate on "can E2B reach a sandbox at
# all" — running it against an unproven namespace would let a namespace
# problem masquerade as a data-plane failure and blow up the gate verdict
# for the wrong reason. So this deliberately matches the PoC's proven shape
# and is applied by hand:
#
#     kubectl apply -f infra/k8s/sandbox/sandboxset.yaml
#
# Once the gate is green, moving this into base/ under `expert-work` is a
# small follow-up with a known-good baseline to compare against.
#
# SHAPE
# -----
# Copied from the PoC's `SandboxSet/base` (the only shape verified to work
# here), with three deliberate changes: our own image, replicas 1 instead of
# 0, and 1c/2Gi instead of 0.5c/1Gi.
#
#   compute-class: agent-sandbox   selects the microVM sandbox compute type;
#                                  without this label you get an ordinary pod
#   runtimes: agent-runtime        injects envd as a native sidecar — this is
#                                  how `commands.run` reaches into the sandbox.
#                                  It is NOT baked into our image (W1 Task 1
#                                  checked: the platform injects it via a
#                                  shared volume at $ENVD_DIR)
#   runtimes: csi                  CSI volume support — unused this wave
#                                  (workspace is the sandbox's own disk until
#                                  wave 2 mounts NAS), kept because the PoC
#                                  proved this exact combination works
#   persistentContents: filesystem the filesystem survives pause/resume, which
#                                  is what makes warm sessions worth having
#
# The container command REPLACES our image's ENTRYPOINT (`python
# /opt/runner.py`). That is intentional and is the core runtime difference of
# this migration: the local docker supervisor drives runner.py's line-JSON
# protocol over a held pipe, while here the container just stays alive and
# envd executes commands beside it (spec § 6.1). runner.py stays in the image
# — the local supervisor backend still uses it — it simply is not PID 1 here.
# `bash` being the command is also why the image MUST ship bash.
apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: expert-work-sandbox
  namespace: default
spec:
  # Pool size. Claiming from a warm pool was 0.09s in the PoC vs ~40s cold —
  # 1 is enough for one operator; raise it when concurrent runs justify it.
  replicas: 1
  persistentContents:
    - filesystem
  runtimes:
    - name: agent-runtime
    - name: csi
  updateStrategy:
    maxUnavailable: 20%
  template:
    metadata:
      labels:
        alibabacloud.com/compute-class: agent-sandbox
    spec:
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      # The PoC pulled public images (anolisos/busybox) so it never needed
      # this. Our sandbox image is in the private ACR, and a Secret cannot be
      # referenced across namespaces, so `default` needs its own copy of the
      # `acr-pull` credential. Both namespaces' copies are written by
      # `tools/deploy/acr-pull-secret.sh` (one run does both).
      #
      # That Secret MUST carry the -vpc host below, not just the public one:
      # a dockerconfigjson is keyed BY HOST and the kubelet uses only the
      # entry matching the image reference it is pulling. Without a matching
      # entry the pod reaches ImagePullBackOff with "insufficient_scope:
      # authorization failed" — and the pool then silently sits at
      # availableReplicas 0 rather than surfacing an error, which is how this
      # failure mode stays invisible. The script writes both hosts for
      # exactly this reason; check with:
      #
      #   kubectl -n default get secret acr-pull \
      #     -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d \
      #     | python3 -c 'import json,sys; print(*sorted(json.load(sys.stdin)["auths"]))'
      #
      # Folding this file into base/ under `expert-work` (see header) would
      # remove the second copy, not the two-host requirement.
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: main
          # B-55 — the `-vpc` host, deliberately. This is the ONE image
          # reference in the repo that does not use the public ACR endpoint.
          #
          # Cold sandbox creation is dominated by this pull, and the two
          # endpoints are the same registry at very different speeds. Measured
          # on this cluster, same image, same digest, repeated:
          #
          #   public  crpi-….personal.cr.aliyuncs.com        112s   5.8 MB/s
          #   VPC     crpi-…-vpc.personal.cr.aliyuncs.com     66s   18-23 MB/s
          #
          # (2026-09-19: kubelet reported "Successfully pulled … in 1m6.19s"
          # for the 619MB image over the -vpc host.)
          #
          # 2026-09-20 重钉 `621249f6` → `7ac31957` 之后在同一个集群实测:
          #
          #   压缩层合计   619.4 MiB → 433.7 MiB   (−30.0%)
          #   kubelet 拉取  66.19s    → 40.55s      (−38.7%,每次冷建省 25.6s)
          #
          # (kubelet 原文:`Successfully pulled … in 40.548s`,`Image size:
          # 454814156 bytes` —— 与 manifest 的压缩层合计逐字节对上。)
          #
          # 瘦身来自两处,都在 `infra/sandbox-image/Dockerfile` 里:apt 装的
          # ffmpeg 换成 `imageio-ffmpeg` wheel 里的静态二进制(它的依赖闭包
          # 145 个包 / 387 MB,含 libllvm19 127 MB 和 mesa —— 在一个无显示
          # 的容器里),以及删掉 npm(832 次真实 run 里 0 次成功安装,出网代理
          # 挡 npm registry)。apt 包数 786 → 282,安装体积 1263 MB → 742 MiB。
          #
          # 上面那两行 MB/s 是**线速**;kubelet 报的秒数含解压落盘,所以端到端
          # 折算下来只有 ~11 MB/s,别拿两者互相验算。
          #
          # Why only here: everything else in the repo is pulled at deploy
          # time, once, by a rollout that is already waiting on other things.
          # This one is pulled on the user-visible path — a cold sandbox is a
          # user sitting in front of a run that has not started yet. The
          # public host stays the default elsewhere so that a VPC/DNS problem
          # cannot take out the whole platform, only the sandbox pool.
          #
          # Rolling back is a one-line edit to the public host, and it needs
          # no credential change — the Secret carries both hosts (see above).
          image: crpi-sgadimluo7wm655m-vpc.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/sandbox:7ac31957
          imagePullPolicy: IfNotPresent
          # See the ENTRYPOINT note in this file's header.
          command:
            - bash
            - -c
            - sleep 2147483647
          # The docker supervisor's per-sandbox ceiling is 1 CPU / 1024MB
          # (supervisor env). Memory is doubled here because this image is
          # 2.46GB and LibreOffice/Node need headroom the old tmpfs-backed
          # sandbox did not. The platform rounds requests to its own
          # undocumented size tiers — W1 Task 3's probe reports what we
          # actually get.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi

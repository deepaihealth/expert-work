# Production real values(2026-09-07 开荒日填入,来源 ~/.kube/expert-work-prod-params.env
# 的非密项)。Structure mirrors overlays/test/configmap-patch.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane-config
data:
  EXPERT_WORK_ENV: "prod"
  EXPERT_WORK_AUTH_MODE: "prod"
  EXPERT_WORK_KEYCLOAK_ENABLED: "true"
  # Same three carry-overs the test env learned live (see overlays/test/
  # configmap-patch.yaml for the full stories): sql_encrypted because
  # local_dev's put() is per-process memory and prod runs 2 replicas;
  # BOTH audiences because the SPA's bearer is the id_token (aud =
  # client id); /kc on the in-cluster Keycloak URL because the code
  # default misses KC_HTTP_RELATIVE_PATH.
  EXPERT_WORK_SECRET_STORE_BACKEND: "sql_encrypted"
  EXPERT_WORK_OIDC_AUDIENCE: '["expert-work-api-internal","expert-work-admin-ui"]'
  EXPERT_WORK_KEYCLOAK_BASE_URL: "http://keycloak:8080/kc"
  EXPERT_WORK_OIDC_ISSUER: "https://expert-work.deepaihealth.com/kc/realms/expert-work"
  EXPERT_WORK_OIDC_JWKS_URI: "https://expert-work.deepaihealth.com/kc/realms/expert-work/protocol/openid-connect/certs"
  # 与 test 一致(#1145 第三方对接拍板):成员开通走 password 模式。
  EXPERT_WORK_MEMBER_PROVISIONING_MODE: "password"
  # PROD-12(#1315):每副本的模型 RPM = 配置值 / 本值(向上取整),让
  # N 副本的总出量不超过厂商额度。必须与 control-plane Deployment 的
  # spec.replicas(base 为 2)同步改 —— smoke.sh 校验两者一致。
  EXPERT_WORK_REPLICA_COUNT: "2"
  # 首个平台管理员:该邮箱用户首次以已验证 JWT 登录且系统零 platform admin
  # 时自动升 system_admin(bootstrap-admin runbook 的生产推荐路径)。
  EXPERT_WORK_BOOTSTRAP_ADMIN_EMAIL: "qian.qing0926@gmail.com"
  # EXPERT_WORK_QUOTA_REDIS_URL carries the Redis AUTH password — it
  # lives in the Secret (secrets.env.example), deliberately not here.
  EXPERT_WORK_OBJECT_STORE_ENDPOINT_URL: "https://s3.oss-cn-hangzhou-internal.aliyuncs.com"
  EXPERT_WORK_OBJECT_STORE_BUCKET: "expert-work-prod"
  EXPERT_WORK_OBJECT_STORE_REGION: "cn-hangzhou"
  EXPERT_WORK_SANDBOX_SUPERVISOR_URL: ""
  # 沙箱迁移 W1/W2 六键 —— PROD-5(2026-08-24)从 test 补齐(此前骨架停在
  # 迁移前)。语义与坑见 overlays/test/configmap-patch.yaml 对应注释;
  # E2B_DOMAIN = prod 集群 ack-sandbox-manager 网关域名(不带 `*.` 前缀),
  # TEMPLATE = prod 集群自己的 SandboxSet(infra/k8s/sandbox/ 需在 prod
  # 集群 by hand apply,见 production-release.md)。
  EXPERT_WORK_SANDBOX_BACKEND: "agent_sandbox"
  # B-81 —— 沙箱里 pip 的索引源。**不配就是直连 pypi.org**,而在阿里云杭州那条链路
  # 实测只有 16 KiB/s:2026-09-19 在沙箱 pod 里量,官方 CDN 首字节 1.46s / 16 KiB/s
  # (24.6 MiB 的 pymupdf wheel 要约 26 分钟,pip 必然 ReadTimeout —— 09-18 真实对话
  # fcc9d02e 四次 pip 全挂,累计 505s),阿里云内网镜像 3863 KiB/s,同一个 wheel 2 秒。
  #
  # 用**内网**地址(mirrors.cloud.aliyuncs.com,解析到 100.100.x.x):不走公网带宽,
  # 且比公网镜像(143 KiB/s)再快 27 倍。代价是它**只有 http** —— https 证书验不过,
  # 所以必须给 PIP_TRUSTED_HOST。放弃的是传输层校验,**兜底的是 pip 自己的 wheel
  # 哈希校验**;链路在阿里云内网、不过公网,这个取舍是明写的、不是疏忽。
  # 备源是腾讯云公网镜像(B-212)。**pip 下载用的其实是备源**:同一个文件两个源都有时,
  # pip 25 的解析器按逆序取候选,落在 extra-index 那份上。10-24 在测试沙箱里量:此前备源
  # 是阿里云公网镜像(382 KiB/s),沙箱里每次 pip 下载都走它 —— scikit-learn 21.5s,
  # 只配内网 1.8s,换腾讯云 2.4s(沙箱直连 22.8 MB/s、经出网代理 75 MB/s)。不再用
  # 阿里云公网:阿里云出问题时它和内网会一起挂。选商用云镜像不选高校镜像,因为它扛全部
  # 下载流量(清华镜像在这里回 403)。任一个源挂了 pip 都从另一个下,只多等约 7s 重试。
  #
  # 注入路径不是这里直接给沙箱 —— 是控制面读这三个变量,再由
  # orchestrator.tools.sandbox.exec_envs 在每次 exec 注入(两个后端唯一来源)。
  # 不写进 SandboxSet 的 pod env:agent 的 exec 走 ACS/envd,它是否继承 pod env
  # 我们验不了(记忆里有「envd 不继承镜像 ENV」这条先例)。
  EXPERT_WORK_SANDBOX_PIP_INDEX_URL: "http://mirrors.cloud.aliyuncs.com/pypi/simple/"
  EXPERT_WORK_SANDBOX_PIP_EXTRA_INDEX_URL: "https://mirrors.cloud.tencent.com/pypi/simple/"
  EXPERT_WORK_SANDBOX_PIP_TRUSTED_HOST: "mirrors.cloud.aliyuncs.com"
  EXPERT_WORK_SANDBOX_E2B_DOMAIN: "expert-work-sbx.deepaihealth.com"
  EXPERT_WORK_SANDBOX_E2B_TEMPLATE: "expert-work-sandbox"
  EXPERT_WORK_WORKSPACE_NAS_ROOT: "/mnt/workspaces"
  EXPERT_WORK_SANDBOX_WORKSPACE_PV_NAME: "workspace-nas"
  EXPERT_WORK_SANDBOX_WORKSPACE_SUBPATH_PREFIX: ""
  # B-236 过渡期截止日(ISO,含当天,按 UTC 日期 —— 次日 00:00 UTC 关窗):窗口内
  # agent 根下已有的一级目录在对话视图里按原相对路径只读可见。不设 = 不映射。
  # 生产发布 B-236 时必须改成「生产发布日 + 4 周」(这里先与测试同值占位)。
  EXPERT_WORK_WORKSPACE_COMPAT_ROOT_DIRS_UNTIL: "2026-12-10"
  EXPERT_WORK_WEB_SEARCH_SEARXNG_BASE_URL: "http://searxng:8080"

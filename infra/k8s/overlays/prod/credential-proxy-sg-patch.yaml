# B-217 — credential-proxy on its own security group (production:
# ew-prod-credproxy), so the sandbox security group can allow egress to exactly
# this one service by group reference. Only this group: on test ACS rejected a
# pod in both the cluster group (enterprise) and a normal group
# (InvalidParameter, 2026-10-24). ew-prod-credproxy allows ingress on 8080/8081
# from the VPC (172.16.0.0/12) and from ew-prod-sandbox, plus 10250 (kubectl
# logs/exec); egress is unrestricted. RDS and Redis allow 172.16.0.0/12 by IP
# (checked 2026-10-25), and list this group too.
#
# Safe before the sandbox pool moves: sandboxes still on the cluster group reach
# the proxy through the VPC rule. docs/design/sandbox-network-isolation-acs.md § 7.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-proxy
spec:
  template:
    metadata:
      annotations:
        network.alibabacloud.com/security-group-ids: "sg-bp14yleiog3dkd0io2ox"

# Test-env real values layered onto base/configmap.yaml's neutral
# defaults (strategic-merge on ConfigMap.data — only listed keys change;
# everything else, e.g. EXPERT_WORK_OBJECT_STORE_ADDRESSING_STYLE and
# the multi-replica switches, keeps the base value).
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane-config
data:
  # settings.py `env: Literal["dev", "staging", "prod"]` has no "test"
  # tier — staging is the closest fit for this environment.
  EXPERT_WORK_ENV: "staging"
  EXPERT_WORK_AUTH_MODE: "prod"
  EXPERT_WORK_KEYCLOAK_ENABLED: "true"
  # sql_encrypted, NOT base's local_dev: local_dev's put() writes process
  # memory, so with 2 replicas a key pasted via the admin UI lands in ONE
  # pod and every run routed to the other 500s with SecretNotFound (found
  # live at PR-2 smoke — the classic single-process assumption). The
  # encrypted vault stores in Postgres (KEK = EXPERT_WORK_SECRET_
  # ENCRYPTION_KEY), shared across replicas. Platform secrets (OSS AK/SK,
  # keycloak admin-client secret) are seeded once via
  # control_plane.seed_keycloak_secret + an inline put — see the PR-2
  # runbook.
  EXPERT_WORK_SECRET_STORE_BACKEND: "sql_encrypted"
  # In-cluster Keycloak admin/token calls — must carry the /kc relative
  # path (KC_HTTP_RELATIVE_PATH in keycloak/statefulset.yaml); the code
  # default is bare http://keycloak:8080 which 404s (HTML → JSON decode
  # error in the token client). Found live at PR-2 setup time.
  EXPERT_WORK_KEYCLOAK_BASE_URL: "http://keycloak:8080/kc"
  # BOTH audiences — the admin-ui SPA sends the id_token as its bearer
  # (apps/admin-ui/src/auth/oidc.ts), whose aud is the CLIENT id
  # (expert-work-admin-ui); the realm's audience mapper only decorates
  # access tokens with expert-work-api-internal. base's single-value
  # default rejects every SPA login with AUTH_INVALID_TOKEN (found live
  # at PR-2 smoke; same dual-value recipe as docs/runbooks/
  # getting-started.md).
  EXPERT_WORK_OIDC_AUDIENCE: '["expert-work-api-internal","expert-work-admin-ui"]'
  EXPERT_WORK_OIDC_ISSUER: "https://expert-work-test.deepaihealth.com/kc/realms/expert-work"
  EXPERT_WORK_OIDC_JWKS_URI: "https://expert-work-test.deepaihealth.com/kc/realms/expert-work/protocol/openid-connect/certs"
  # EXPERT_WORK_QUOTA_REDIS_URL carries the Redis AUTH password — it
  # lives in the Secret (secrets.env.example), deliberately not here.
  EXPERT_WORK_OBJECT_STORE_ENDPOINT_URL: "https://s3.oss-cn-hangzhou-internal.aliyuncs.com"
  EXPERT_WORK_OBJECT_STORE_BUCKET: "expert-work-test"
  EXPERT_WORK_OBJECT_STORE_REGION: "cn-hangzhou"
  # Langfuse: base's in-cluster default (http://langfuse-web:3000) is
  # already right for this env — keys land in control-plane-secrets
  # (W2-PR3). Langfuse's own env is patched in
  # langfuse-configmap-patch.yaml.
  # There is no sandbox-supervisor Deployment on this cluster and there
  # never will be — the sandbox migration replaced it here with ACS Agent
  # Sandbox. Blank overrides base's compose-only default so nothing dials
  # a Service that isn't deployed. It stays blank rather than being
  # deleted because settings.py's backend inference reads it: with
  # EXPERT_WORK_SANDBOX_BACKEND set explicitly below, inference is bypassed
  # anyway, but a non-empty value here would be a live foot-gun the day
  # someone flips the backend back to "supervisor" to debug.
  EXPERT_WORK_SANDBOX_SUPERVISOR_URL: ""
  # Sandbox migration W1 — sandboxes run as ACS Agent Sandbox microVMs
  # reached through the E2B SDK, not local docker containers.
  EXPERT_WORK_SANDBOX_BACKEND: "agent_sandbox"
  # The ack-sandbox-manager gateway's domain, WITHOUT the `*.` prefix and
  # without a scheme. Reached over plain HTTP: the ALB only listens on 80,
  # which is why AgentSandboxClient calls patch_e2b(https=False). The
  # matching API key is EXPERT_WORK_SANDBOX_E2B_API_KEY in
  # control-plane-secrets.
  EXPERT_WORK_SANDBOX_E2B_DOMAIN: "expert-work-sbx-test.deepaihealth.com"
  # The SandboxSet to claim warm sandboxes from
  # (infra/k8s/sandbox/sandboxset.yaml). Note that CR lives in the
  # `default` namespace, not `expert-work` — see that file's header for
  # why; sandbox ids consequently come back as
  # `default--expert-work-sandbox-<suffix>`.
  EXPERT_WORK_SANDBOX_E2B_TEMPLATE: "expert-work-sandbox"
  # Sandbox migration W2 — user workspace storage (NAS). The three
  # settings configure where control-plane and sandboxes store user
  # work: control-plane mounts NAS at this root path; each sandbox gets
  # a per-(tenant, user) subPath within the PVC. EXPERT_WORK_SANDBOX_
  # WORKSPACE_SUBPATH_PREFIX ("") is relative to NAS /workspaces mount
  # (relative semantics TBD pending CSI workgroup validation; see
  # docs/research/2026-08-07-sandbox-w2-probe-results.md § 七).
  EXPERT_WORK_WORKSPACE_NAS_ROOT: "/mnt/workspaces"
  EXPERT_WORK_SANDBOX_WORKSPACE_PV_NAME: "workspace-nas"
  EXPERT_WORK_SANDBOX_WORKSPACE_SUBPATH_PREFIX: ""
  # EXPERT_WORK_SANDBOX_EGRESS_PROXY_HOST/_PORT keep their settings.py
  # defaults (credential-proxy.expert-work.svc.cluster.local:8081), which
  # are already right here: sandboxes run in `default` while the proxy
  # Service is in `expert-work`, so the FQDN — not the short name — is
  # what resolves. The HMAC key the sandbox side mints egress tokens with
  # is EXPERT_WORK_SANDBOX_EGRESS_TOKEN_SECRET in control-plane-secrets.
  EXPERT_WORK_WEB_SEARCH_SEARXNG_BASE_URL: "http://searxng:8080"

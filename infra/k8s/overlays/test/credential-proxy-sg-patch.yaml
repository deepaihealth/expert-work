# B-217 — credential-proxy on its own security group (test cluster:
# ew-test-credproxy), so the sandbox security group can allow egress to exactly
# this one service by group reference. Only this group: ACS rejects a pod that
# joins both the cluster group (enterprise) and a normal group
# (InvalidParameter, measured 2026-10-24). ew-test-credproxy allows ingress on
# 8080/8081 from the VPC and from ew-test-sandbox, plus 10250 (kubectl
# logs/exec); the sandbox group's own egress only opens 8081 (CONNECT), not
# 8080 (/forward, unauthenticated). Egress is unrestricted (the proxy is the
# audited way out). docs/design/sandbox-network-isolation-acs.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-proxy
spec:
  template:
    metadata:
      annotations:
        network.alibabacloud.com/security-group-ids: "sg-bp1hjzkfjlao7lcv45py"

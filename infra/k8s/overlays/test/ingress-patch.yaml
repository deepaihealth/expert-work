# expert-work-test.deepaihealth.com — real ALB routing for the test env.
#
# spec.rules has no Kubernetes strategic-merge key (IngressRule is an
# unkeyed list), so patching it means a full replacement, not a diff —
# this mirrors base/ingress.yaml's paths/backends verbatim plus `host`.
# Keep the two files in sync by hand (same caveat T3 left for
# configMapGenerator files — see base/kustomization.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expert-work
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    # Certificate and idle/request timeouts are NOT Ingress annotations in
    # the Aliyun ALB controller (verified against the ALB Ingress
    # configuration dictionary at PR-2 deploy time — `cert-id` /
    # `idle-timeout` annotations do not exist). Both live on the shared
    # AlbConfig's 443 listener instead: see
    # infra/k8s/cluster/albconfig-listeners-patch.yaml.
spec:
  rules:
    - host: expert-work-test.deepaihealth.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  number: 8000
          - path: /kc
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-ui
                port:
                  number: 8080

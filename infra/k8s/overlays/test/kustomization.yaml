# W2-PR1 Task 4 — expert-work-test.deepaihealth.com overlay. Real
# per-environment values on top of infra/k8s/base/ (control-plane +
# admin-ui + Keycloak + searxng + migrate Job). See
# docs/superpowers/plans/2026-07-29-w2-pr1-k8s-foundation.md Task 4 and
# docs/superpowers/specs/2026-07-28-aliyun-deployment-design.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Deployed image tags — updated by hand at release time (edit + commit,
# then `kubectl apply -k`). Tag convention: `<main sha>` for
# control-plane, `<main sha>-test` for the env-specific admin-ui build
# (OIDC build args baked in — see tools/deploy/build-push.sh). An `-rN`
# suffix means a same-source rebuild pushed under a NEW tag: the ACS
# image cache resolves tags without consulting the registry, so
# re-pushing an existing tag serves stale bits — every release must mint
# a fresh tag. (Follow-up: digest pinning would remove this class of
# problem entirely.)
images:
  - name: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/control-plane
    newTag: c304294a
  - name: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/admin-ui
    newTag: c304294a-test
  # The cluster VPC cannot reach docker.io / quay.io (dial timeout — same
  # constraint W0 hit with probe pods), so base's upstream keycloak and
  # searxng images are remapped to ACR mirror copies pushed from a dev
  # machine (docker pull upstream → tag → push; searxng's `latest` is
  # pinned as a dated snapshot at mirror time).
  - name: quay.io/keycloak/keycloak
    newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/keycloak
    newTag: "25.0"
  - name: searxng/searxng
    newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/searxng
    newTag: "2026-07-29"

# Replaces base's vendored searxng settings with the mainland-engine-only
# variant — the cluster VPC cannot reach the upstream default engines
# (google/ddg/wikipedia); see searxng-settings-cn.yml's header.
configMapGenerator:
  - name: searxng-settings
    behavior: replace
    files:
      - settings.yml=searxng-settings-cn.yml

patches:
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml
  - path: keycloak-patch.yaml

# Secrets (control-plane-secrets / keycloak-secrets) are NOT built by
# kustomize here — see secrets.env.example for how PR-2 provisions them
# directly against the cluster (kubectl create secret --from-env-file).

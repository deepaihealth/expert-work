# W2-PR1 Task 4 — expert-work-test.deepaihealth.com overlay. Real
# per-environment values on top of infra/k8s/base/ (control-plane +
# admin-ui + Keycloak + searxng + migrate Job). See
# docs/superpowers/plans/2026-07-29-w2-pr1-k8s-foundation.md Task 4 and
# docs/superpowers/specs/2026-07-28-aliyun-deployment-design.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# Deployed image tags — updated by hand at release time (edit + commit,
# then `kubectl apply -k`). Tag convention: `<main sha>` for
# control-plane, `<main sha>-test` for the env-specific admin-ui build
# (OIDC build args baked in — see tools/deploy/build-push.sh). An `-rN`
# suffix means a same-source rebuild pushed under a NEW tag: the ACS
# image cache resolves tags without consulting the registry, so
# re-pushing an existing tag serves stale bits — every release must mint
# a fresh tag. (Follow-up: digest pinning would remove this class of
# problem entirely.)
  # The cluster VPC cannot reach docker.io / quay.io (dial timeout — same
  # constraint W0 hit with probe pods), so base's upstream keycloak and
  # searxng images are remapped to ACR mirror copies pushed from a dev
  # machine (docker pull upstream → tag → push; searxng's `latest` is
  # pinned as a dated snapshot at mirror time).
  # W2-PR3 — observability + Langfuse mirrors (same docker.io-unreachable
  # constraint; pushed by tools/deploy/mirror script from a dev machine).
  # clickhouse + otel-collector carry an -r1 suffix: their original tags
  # were first pushed as arm64 by mistake (containerd store push picks
  # the host arch — exec format error on cluster) and MAY be cached
  # tag-level by ACS; a fresh tag guarantees the amd64 bits (same rule
  # as the `-rN` release convention above).
images:
- name: clickhouse/clickhouse-server
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/clickhouse-server
  newTag: 24.12-alpine-r1
- name: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/admin-ui
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/admin-ui
  newTag: 3faccaf4-test
- name: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/control-plane
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/control-plane
  newTag: c3e70516
- name: grafana/grafana
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/grafana
- name: grafana/tempo
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/tempo
- name: langfuse/langfuse
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/langfuse
- name: langfuse/langfuse-worker
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/langfuse-worker
- name: otel/opentelemetry-collector
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/opentelemetry-collector
  newTag: 0.119.0-r1
- name: prom/alertmanager
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/alertmanager
- name: prom/prometheus
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/prometheus
- name: quay.io/keycloak/keycloak
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/keycloak
  newTag: "25.0"
- name: searxng/searxng
  newName: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/searxng
  newTag: "2026-07-29"

# Replaces base's vendored searxng settings with the mainland-engine-only
# variant — the cluster VPC cannot reach the upstream default engines
# (google/ddg/wikipedia); see searxng-settings-cn.yml's header.
configMapGenerator:
- behavior: replace
  files:
  - settings.yml=searxng-settings-cn.yml
  name: searxng-settings

patches:
- path: configmap-patch.yaml
- path: ingress-patch.yaml
- path: keycloak-patch.yaml
- path: langfuse-configmap-patch.yaml
- path: langfuse-ingress-patch.yaml

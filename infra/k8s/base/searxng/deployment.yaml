# SearXNG — self-hosted metasearch backing the builtin web_search tool.
# SECURITY: no Ingress route to this Service (§3.4, infra/searxng —
# internal-only JSON API, never expose publicly); control-plane reaches
# it in-cluster at http://searxng:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      containers:
        - name: searxng
          # TODO: pin to a digest before production rollout — no network
          # access at authoring time to resolve :latest's current sha256.
          image: searxng/searxng:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng:8080/"
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: settings
          configMap:
            name: searxng-settings

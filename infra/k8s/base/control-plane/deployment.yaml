apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      # 波 2 BUG-1 —— 工作区在 NAS 上被两个 uid 共读写:control-plane 是
      # uid 10002,沙箱里的 agent 是 uid 10000。把 10000 挂进本 Pod 的附加组,
      # 加上工作区目录的 setgid(见 WORKSPACE_DIR_MODE),两侧才能读到对方
      # 写的 0640 文件。集群实测:阿里云 NAS(NFSv3 AUTH_SYS)完整支持附加组
      # 与 setgid 目录。数字由 test_workspace_shared_gid.py 钉住。
      #
      # 顺序敏感:这一项与代码里的 0640 必须同一次 release 落地。先上代码后
      # 上本项 = control-plane 既不在组里、文件又不再 world-readable,全部
      # 下载当场失败。
      securityContext:
        supplementalGroups: [10000]
      containers:
        - name: control-plane
          # Overlay pins the real tag; :latest here is a build-time
          # placeholder only (kustomize does not resolve/validate images).
          image: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/control-plane:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: control-plane-config
            - secretRef:
                name: control-plane-secrets
          # local_dev SecretStore dotenv vault (EXPERT_WORK_SECRET_STORE_ENV_FILE
          # in configmap.yaml) — resolves the object-store `secret://` refs.
          # Without this mount the file simply doesn't exist and every
          # secret:// lookup fails (see secrets.example.yaml for how to
          # provision the Secret this reads).
          volumeMounts:
            - name: secret-store-files
              mountPath: /run/secret-store
              readOnly: true
            - name: workspace-nas
              mountPath: /mnt/workspaces
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          # Three distinct probes per api/health.py — live never touches
          # deps (restart trigger), ready aggregates dep checks +
          # lifecycle state, startup is true only once Lifecycle.mark_ready
          # fires (gates live/ready until the app has actually finished
          # boot, per subsystems/28 § 3.1).
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      # `optional: false` (the default, spelled out here) — a missing
      # Secret must fail pod scheduling loudly, not silently start
      # control-plane with an empty secret-store vault.
      volumes:
        - name: secret-store-files
          secret:
            secretName: control-plane-secret-files
            optional: false
        - name: workspace-nas
          persistentVolumeClaim:
            claimName: workspace-nas

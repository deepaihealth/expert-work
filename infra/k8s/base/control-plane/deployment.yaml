apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: 2
  # B-80 —— 滚动发布不打断在跑的对话。旧 pod 收口最长要 run_drain_timeout_s
  # (默认 300s),默认的 maxSurge=25%/maxUnavailable=25% 在 2 副本上化成
  # surge=1 / unavailable=0,于是两个旧 pod 只能一个接一个地腾位子,整轮滚动
  # 变成 2×收口 = 10 分钟以上,发布脚本的 rollout 等待必然先超时。
  # maxSurge=2 让两个新 pod 一次起齐,两个旧 pod 并行收口 —— 整轮 ≈ 一次收口。
  # maxUnavailable 保持 0:收口期间旧 pod 仍在服务,容量不掉。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      containers:
        - name: control-plane
          # Overlay pins the real tag; :latest here is a build-time
          # placeholder only (kustomize does not resolve/validate images).
          image: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/control-plane:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: control-plane-config
            - secretRef:
                name: control-plane-secrets
          # local_dev SecretStore dotenv vault (EXPERT_WORK_SECRET_STORE_ENV_FILE
          # in configmap.yaml) — resolves the object-store `secret://` refs.
          # Without this mount the file simply doesn't exist and every
          # secret:// lookup fails (see secrets.example.yaml for how to
          # provision the Secret this reads).
          volumeMounts:
            - name: secret-store-files
              mountPath: /run/secret-store
              readOnly: true
            - name: workspace-nas
              mountPath: /mnt/workspaces
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          # Three distinct probes per api/health.py — live never touches
          # deps (restart trigger), ready aggregates dep checks +
          # lifecycle state, startup is true only once Lifecycle.mark_ready
          # fires (gates live/ready until the app has actually finished
          # boot, per subsystems/28 § 3.1).
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      # B-80 —— 必须显著大于 ``EXPERT_WORK_RUN_DRAIN_TIMEOUT_S``(默认 300s):
      # 到点 k8s 就 SIGKILL,收口没做完就被砍等于白做。360 = 300 收口 + 60 给
      # preStop(5s)、HTTP drain、各 worker stop 与连接池释放。改其中一个必须
      # 一起改另一个 —— 还有 ``tools/deploy`` 里 rollout 等待的超时。
      terminationGracePeriodSeconds: 360
      # `optional: false` (the default, spelled out here) — a missing
      # Secret must fail pod scheduling loudly, not silently start
      # control-plane with an empty secret-store vault.
      volumes:
        - name: secret-store-files
          secret:
            secretName: control-plane-secret-files
            optional: false
        - name: workspace-nas
          persistentVolumeClaim:
            claimName: workspace-nas

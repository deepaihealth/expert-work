# Secret KEY NAMES + placeholder values only — NOT a real manifest, and
# deliberately NOT listed as a `resources:` entry in kustomization.yaml
# (per Task 3 brief: "Secret 不进 base"). Applying this file as-is would
# create real Secret objects full of placeholder junk; do not `kubectl
# apply -f` it.
#
# How to actually provision these two Secrets in a target namespace:
#
#   Option A — imperative, fastest, good enough for the W2 test env:
#     kubectl create secret generic control-plane-secrets \
#       -n expert-work \
#       --from-literal=EXPERT_WORK_DB_DSN='postgresql+asyncpg://...' \
#       --from-literal=EXPERT_WORK_CHECKPOINTER_DSN='postgresql://...' \
#       ... (one --from-literal per key below)
#     kubectl create secret generic keycloak-secrets -n expert-work ...
#
#   Option B — GitOps-friendly, encrypts the values so this *can* live in
#   git: install the Bitnami SealedSecrets controller, then
#     kubeseal --format yaml < filled-in-secret.yaml > sealed-secret.yaml
#   and commit the sealed output instead (only the cluster's controller
#   can decrypt it). Recommended follow-up once this moves past the W2
#   test env — not wired up in this PR.
#
# control-plane's Deployment references `control-plane-secrets` via
# envFrom (control-plane/deployment.yaml) and the migrate Job pulls one
# key from the same Secret (control-plane/migrate-job.yaml). Keycloak's
# StatefulSet references `keycloak-secrets` via individual secretKeyRefs
# (keycloak/statefulset.yaml). control-plane's Deployment ALSO mounts a
# THIRD Secret, `control-plane-secret-files`, as a read-only file volume
# at /run/secret-store/ (not envFrom — see that file's own comment below
# for why its shape is different). The migrate Job does NOT mount it —
# migrations never touch object storage.
---
apiVersion: v1
kind: Secret
metadata:
  name: control-plane-secrets
  namespace: expert-work
type: Opaque
stringData:
  # Pooled async DSN — control-plane's primary store connection. Point
  # this at the RDS instance (with or without a managed pooler in front,
  # environment-dependent); infra/docker-compose.yml's compose-only
  # equivalent goes through PgBouncer at :6432.
  EXPERT_WORK_DB_DSN: "postgresql+asyncpg://CHANGE_ME:CHANGE_ME@CHANGE_ME-rds-host:5432/expert_work"
  # LangGraph checkpointer — direct-to-Postgres (NOT pgbouncer/a pooler:
  # AsyncPostgresSaver's prepared statements need a real session).
  EXPERT_WORK_CHECKPOINTER_DSN: "postgresql://CHANGE_ME:CHANGE_ME@CHANGE_ME-rds-host:5432/expert_work"
  # migrate Job only (control-plane/migrate-job.yaml) — sync psycopg DSN,
  # direct Postgres, alembic.ini's driver.
  EXPERT_WORK_DB_URL: "postgresql+psycopg://CHANGE_ME:CHANGE_ME@CHANGE_ME-rds-host:5432/expert_work"
  # Quota / rate-limit engine backing store. Treated as secret here
  # because the managed cloud Redis instance requires AUTH (unlike the
  # no-password compose default) — the password lives in this URL.
  EXPERT_WORK_QUOTA_REDIS_URL: "redis://:CHANGE_ME@CHANGE_ME-redis-host:6379/0"
  # Stream Q encrypted-vault KEK — 32-byte base64 key. Only meaningful
  # once EXPERT_WORK_SECRET_STORE_BACKEND=sql_encrypted; generate with
  # e.g. `openssl rand -base64 32`.
  EXPERT_WORK_SECRET_ENCRYPTION_KEY: "CHANGE_ME-32-byte-base64-key"
  # HMAC salt for API-key rate-limit bucketing (Settings.apikey_rate_limit_hmac_salt).
  # Not wired into infra/docker-compose.yml today; generate a random
  # value per environment, e.g. `openssl rand -hex 32`.
  EXPERT_WORK_APIKEY_RATE_LIMIT_HMAC_SALT: "CHANGE_ME-random-salt"
  # Gates the unauthenticated POST /v1/setup first-run wizard.
  EXPERT_WORK_SETUP_TOKEN: "CHANGE_ME-setup-token"
  # Both Langfuse keys — the public key is included here (not in
  # configmap.yaml) because it is paired 1:1 with the secret key for a
  # given Langfuse project; keeping both together avoids a split-brain
  # config across two objects. Leave both empty to keep the M0 recording
  # stub (no push) instead of activating a real Langfuse project.
  EXPERT_WORK_LANGFUSE_PUBLIC_KEY: ""
  EXPERT_WORK_LANGFUSE_SECRET_KEY: ""
  # ---------------------------------------------------------- object store
  # NOTE: EXPERT_WORK_OBJECT_STORE_ACCESS_KEY_REF / _SECRET_KEY_REF (in
  # configmap.yaml) are `secret://...` REFERENCES, not literal key
  # material — control-plane resolves them through the pluggable
  # secret_store_backend (EXPERT_WORK_SECRET_STORE_BACKEND), not a plain
  # env var read. The real OSS AK/SK therefore never appear as a
  # `EXPERT_WORK_OBJECT_STORE_*` key here; how you provision them depends
  # on which backend the overlay selects:
  #   - local_dev  (base default): backend reads a mounted dotenv file
  #     (EXPERT_WORK_SECRET_STORE_ENV_FILE) mapping the secret:// URI to
  #     its value — this is the `control-plane-secret-files` Secret below,
  #     mounted as a file (control-plane/deployment.yaml), not compose's
  #     ./dev-keys bind mount.
  #   - aliyun_kms: backend resolves via Aliyun KMS directly — the pod
  #     needs its own RAM credentials (RRSA / instance role), not a k8s
  #     Secret key, to call KMS.
  #   - sql_encrypted: backend reads ciphertext from the store DB,
  #     decrypted with EXPERT_WORK_SECRET_ENCRYPTION_KEY above — seed it
  #     once via the admin UI / seed script, not here.
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: expert-work
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "CHANGE_ME-admin"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME-admin-password"
  # RDS `keycloak` database — a separate DB/user from the app's own
  # `expert_work` database above.
  KC_DB_URL: "jdbc:postgresql://CHANGE_ME-rds-host:5432/keycloak"
  KC_DB_USERNAME: "CHANGE_ME"
  KC_DB_PASSWORD: "CHANGE_ME"
---
# File-mount Secret (NOT envFrom) — control-plane/deployment.yaml mounts
# this read-only at /run/secret-store/. Single key, `secret-store.env`,
# whose value is itself a multi-line `.env`-style file the local_dev
# SecretStore backend parses (one `name=value` per line — the name is the
# `secret://` ref with its scheme prefix stripped, exactly as it appears
# in EXPERT_WORK_OBJECT_STORE_ACCESS_KEY_REF / _SECRET_KEY_REF in
# configmap.yaml). Different shape from the two Secrets above, so it
# can't be built with `kubectl create secret generic --from-literal` per
# key — use `--from-file=secret-store.env=<path>` against a local file
# containing the dotenv content below instead.
apiVersion: v1
kind: Secret
metadata:
  name: control-plane-secret-files
  namespace: expert-work
type: Opaque
stringData:
  secret-store.env: |
    expert-work/platform/oss/access-key=CHANGE_ME-oss-access-key
    expert-work/platform/oss/secret-key=CHANGE_ME-oss-secret-key

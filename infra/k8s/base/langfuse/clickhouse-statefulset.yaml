# ClickHouse — Langfuse v3's analytics store, the ONLY in-cluster
# stateful Langfuse dependency (PG → RDS `langfuse` database, Redis →
# platform cloud Redis DB 1, blobs → OSS `langfuse/` prefix; spec
# 2026-07-28-aliyun-deployment-design.md §3.5). Single replica +
# cloud-disk PVC; if it becomes an operational pain the spec's fallback
# is managed ClickHouse or Langfuse Cloud.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-clickhouse
  labels:
    app.kubernetes.io/name: langfuse-clickhouse
spec:
  serviceName: langfuse-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-clickhouse
    spec:
      # clickhouse image runs as uid 101; fsGroup chowns the fresh disk.
      securityContext:
        fsGroup: 101
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.12-alpine
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: CLICKHOUSE_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

# Alertmanager — P0/P1/P2 routing to the wecom-adapter relay (PROD-2;
# see alertmanager.yml + wecom-adapter-deployment.yaml). nflog/silences
# persist on a cloud-disk PVC (alertmanager-pvc.yaml) so a pod restart
# neither re-fires every active alert into the group nor drops silences.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  # RWO 云盘 + 默认 RollingUpdate = 新旧 pod 争同一块盘死锁整次 rollout
  # (复审 NEW-1)—— 与 grafana/prometheus/tempo 三个兄弟同款 Recreate。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
            items:
              - key: alertmanager.yml
                path: alertmanager.yml
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data

# OTel Collector — receives OTLP from the app pods, forwards traces to
# Tempo. Stateless, single replica (losing a batch on restart is fine).
# Core distro image: the pipeline uses only the otlp receiver/exporter.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.119.0
          command: ["/otelcol", "--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
          # The core distro ships no health_check extension by default —
          # a TCP probe on the OTLP HTTP port is the lightest signal.
          readinessProbe:
            tcpSocket:
              port: otlp-http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: otlp-http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
            items:
              - key: otel-collector-config.yaml
                path: config.yaml

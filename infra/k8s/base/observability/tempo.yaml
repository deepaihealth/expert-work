# W2-PR3 vendored in-cluster copy (source: infra/observability/ — keep in sync by hand,
# same caveat as the keycloak realm / searxng settings copies in this base).
# Grafana Tempo config — Stream G.0.
#
# Single-binary dev Tempo: receives traces over OTLP from the OTel
# Collector, stores blocks on a local volume. Not for production scale.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false

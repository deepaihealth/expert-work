# Grafana state (users, prefs, non-provisioned dashboards) — cloud disk,
# SC pinned explicitly (no default SC in cluster), Aliyun 20Gi minimum.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    app.kubernetes.io/name: grafana
spec:
  storageClassName: alicloud-disk-topology-alltype
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi

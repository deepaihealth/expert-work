# Trace blocks + WAL — cloud disk, SC pinned explicitly (no default SC in cluster).
# 168h retention (tempo.yaml compactor) keeps 20Gi comfortable at
# test-env trace volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  labels:
    app.kubernetes.io/name: tempo
spec:
  storageClassName: alicloud-disk-topology-alltype
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi

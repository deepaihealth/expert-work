# In-cluster only (no Ingress route): Grafana proxies it; humans use
# kubectl port-forward svc/prometheus 9090:9090.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http

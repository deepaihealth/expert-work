# W2-PR3 vendored in-cluster copy (source: infra/observability/ — keep in sync by hand,
# same caveat as the keycloak realm / searxng settings copies in this base).
# Alertmanager config — Stream G.2.
#
# P0/P1/P2 severity routing (subsystems/20 § 5.7). Alerts carry a
# `severity` label set by tools/observability/rules/alerts.yml.
#
#   P0 → 企微群 + @all(5 min SLA)
#   P1 → 企微群(30 min SLA)
#   P2 → 企微群(24 h SLA)
#
# PROD-2(2026-08-24):receivers 从 placeholder 换成真投递 —— 全部走集群内
# wecom-adapter(Alertmanager 不展开 env var,企微 webhook URL 含 key 不能进
# git;adapter 从 Secret ``wecom-alert-webhook`` 读 URL 并把 Alertmanager JSON
# 转成企微消息,p0 额外 @all。见 observability/wecom-adapter/adapter.py)。
# 原设计的 PagerDuty/飞书通道未开通即被企微方案取代(2026-08-24 拍板)。

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # P3 / gate-watch(rules 里共 10 条,含 >0 即发的 gate-watch)刻意静音:
    # 接通 default 之前它们落在空 receiver 里,群里从没见过;直通生产群会
    # 淹掉 P0-P2(终审 I-1)。要看它们去 Prometheus/Grafana;升级投递另议。
    - matchers: ['severity=~"P3|gate-watch"']
      receiver: muted
    - matchers: ['severity="P0"']
      receiver: p0
      group_wait: 0s
      repeat_interval: 1h
    - matchers: ['severity="P1"']
      receiver: p1
      repeat_interval: 2h
    - matchers: ['severity="P2"']
      receiver: p2

receivers:
  # P3 / gate-watch sink — deliberately no webhook_configs.
  - name: muted

  # True catch-all: alerts with NO severity label — still delivered (a
  # missing label is itself a bug worth seeing), tagged "default" by the
  # adapter.
  - name: default
    webhook_configs:
      - url: http://wecom-adapter:8080/alert?channel=default
        send_resolved: true

  # P0 — 企微群 + @all(adapter 对 p0 的 firing 附加 text @all 消息)。
  - name: p0
    webhook_configs:
      - url: http://wecom-adapter:8080/alert?channel=p0
        send_resolved: true

  # P1 — 企微群。
  - name: p1
    webhook_configs:
      - url: http://wecom-adapter:8080/alert?channel=p1
        send_resolved: true

  # P2 — 企微群。
  - name: p2
    webhook_configs:
      - url: http://wecom-adapter:8080/alert?channel=p2
        send_resolved: true

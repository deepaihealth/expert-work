apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-ui
    spec:
      containers:
        - name: admin-ui
          # Image built by W2-PR1 Task 2 (admin-ui containerization); tag
          # pinned per-overlay like control-plane.
          image: registry.cn-hangzhou.aliyuncs.com/expert-work/admin-ui:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          # Generic static-file-server default; adjust the path once
          # Task 2 defines the container's actual health surface.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3

apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-ui
    spec:
      containers:
        - name: admin-ui
          # Image built by W2-PR1 Task 2 (admin-ui containerization); tag
          # pinned per-overlay like control-plane.
          image: crpi-sgadimluo7wm655m.cn-hangzhou.personal.cr.aliyuncs.com/expert-work/admin-ui:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          # /healthz is the nginx health surface added by Task 2
          # (apps/admin-ui/nginx.conf) — a plain 200, not the SPA
          # fallback, so probes don't depend on index.html/JS bundle
          # health.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3

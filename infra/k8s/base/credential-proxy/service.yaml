# Both credential-proxy ports. ClusterIP only — nothing outside the cluster
# should reach either one:
#   forward (8080)  callers are orchestrator tools inside the cluster
#   egress  (8081)  callers are sandboxes; whether a microVM sandbox can
#                   actually reach a ClusterIP is exactly what W1 Task 3's
#                   probe 2 verifies. If it cannot, this Service is not the
#                   fix — the fallback is exposing the proxy through the
#                   Ingress, which adds a public hop and therefore needs
#                   mTLS (spec § 八, risk 2).
apiVersion: v1
kind: Service
metadata:
  name: credential-proxy
  labels:
    app.kubernetes.io/name: credential-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: credential-proxy
  ports:
    - name: forward
      port: 8080
      targetPort: forward
    - name: egress
      port: 8081
      targetPort: egress

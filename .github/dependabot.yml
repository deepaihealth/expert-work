version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-deps:
        patterns:
          - "*"
    ignore:
      # e2b 2.25+ 客户端强制 e2b_ 前缀 key 校验,与 ACS Agent Sandbox 私有协议
      # 不兼容(2026-08-21 真栈事故);升级走 ROADMAP X-13(需重跑沙箱契约探针)。
      - dependency-name: "e2b"
      - dependency-name: "e2b-code-interpreter"
      # mcp 2.x 是真迁移不是升级:SDK 换 httpx2(httpx 2.0 的改名分发包),
      # streamable_http_client 签名从 2 元组变 3 元组、要 httpx2.AsyncClient
      # (orchestrator/tools/mcp.py:606-609)。混进周更组会让整组 4 个 CI job
      # 全红(#1229,import 链炸掉 → 路由发现全空 → 分区自审雪崩)。
      # 单独立项做(ROADMAP X-11),做完连同这条 ignore 一起删。
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"
      # fastapi 0.137 起 include_router 懒挂载,app.routes 不再摊平出
      # APIRoute,控制面整族路由自审失明(#1233;实测边界 0.136.3 好 /
      # 0.137.2 坏)。两个 service 的 pyproject 已钉 <0.137,这条防
      # dependabot 把上界改回去。迁移立项 ROADMAP X-12,做完一起删。
      - dependency-name: "fastapi"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # apps/admin-ui(pnpm-lock.yaml 归 npm 生态)与 infra/sandbox-image 此前都
  # 不在本文件里,意味着只有 Dependabot **security updates** 会碰它们——那条
  # 路径不读本文件,只在已经攒出 CVE 之后才被动开 PR,且对传递依赖(补丁在
  # 传递链上而非直接依赖里)常常连 PR 都开不出来。2026-08-06 清点时 admin-ui
  # 攒了 4 条 high(axios / postcss / fast-uri / brace-expansion)、
  # sandbox-image 攒了 2 个包 4 条 high(Pillow / pypdf),全部是这样漂出来的。
  # 补上常规版本更新,让包在变成安全事件之前就跟着走。
  - package-ecosystem: "npm"
    directory: "/apps/admin-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # 只把 minor/patch 打成一组。major 刻意留在组外单独开 PR:react-router
      # 6→7 这类要单独评估的改动一旦混进来,会连坐让整组 patch 都合不了。
      admin-ui-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node 必须跟运行时的 Node 大版本走(CI 三处 setup-node 都钉在 22)。
      # 把类型升到更高的大版本 = 让 tsc 按一套运行时并不存在的 API 面校验,
      # 编译期放行的调用到了运行时才炸——这是制造错配,不是消除错配。
      # 2026-08-15 因此关掉了 #1173(22 → 26)。Node 大版本升级时,连同这条
      # ignore 一起改,让两者始终同步。
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # 文档站(独立 pnpm 包,自己的 pnpm-lock.yaml)。2026-08-20 之前不在本文件里,
  # 攒出 vite 三条(1 high)+ esbuild 一条告警才发现——与上面 admin-ui 同一课。
  # vite/esbuild 是 vitepress 的传递依赖,修复靠 package.json 里的 pnpm.overrides
  # (vite ^6.4.3 / esbuild ^0.25.0);升 vitepress 大版本时连同 overrides 一起复核。
  - package-ecosystem: "npm"
    directory: "/apps/admin-ui/docs-site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docs-site-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # 沙箱镜像的 Python 依赖。注意合并这类 PR 只改仓库:镜像要重建推 ACR、
  # SandboxSet 换 tag,测试/生产集群才吃到新版本。
  - package-ecosystem: "pip"
    directory: "/infra/sandbox-image"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      sandbox-image-minor-patch:
        update-types:
          - "minor"
          - "patch"

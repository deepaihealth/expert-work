name: Sandbox gVisor (runsc)

# Stream HX-10 — runs the sandbox acceptance suite under gVisor (runsc), the
# production isolation runtime. The suite otherwise only runs under runc (dev /
# the main CI integration job), so "switching to gVisor works" was an
# unverified assumption until now. This turns the M0->M1 Gate's gVisor
# verification from a one-off manual activity into a continuous CI check.
#
# Path-filtered: only fires when sandbox runtime code / image / this workflow
# changes — most PRs do not pay for it. workflow_dispatch for on-demand runs.
#
# Platform: gVisor's systrap platform needs no KVM / nested virtualisation, so
# a stock ubuntu runner suffices. CI pulls runsc from the official Google
# bucket (reachable from GitHub's runners); production hosts in mainland China
# mirror the verified binary via OSS/ACR instead of a direct Google fetch
# (HX-K4) — that is a deploy concern, not a CI one.

on:
  push:
    branches: [main]
    paths:
      - "packages/expert-work-runtime/src/expert_work/runtime/sandbox/**"
      - "services/sandbox-supervisor/**"
      - "infra/sandbox-image/**"
      - ".github/workflows/sandbox-gvisor.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/expert-work-runtime/src/expert_work/runtime/sandbox/**"
      - "services/sandbox-supervisor/**"
      - "infra/sandbox-image/**"
      - ".github/workflows/sandbox-gvisor.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.9.26"
  # gVisor release channel. ``release/latest`` floats; the download is still
  # integrity-checked against its published sha512 below. Production pins a
  # specific build and mirrors it (HX-K4); CI only needs a verified recent
  # build to prove compatibility.
  RUNSC_RELEASE: "release/latest"

jobs:
  gvisor:
    name: Acceptance suite under runsc
    runs-on: ubuntu-latest
    # 20 分钟盛不下一次冷建。下面的预构建步骤在缓存命中时几十秒就好，
    # 但缓存未命中(新 base、requirements.txt 改了、缓存被驱逐)时 Dockerfile
    # 的 apt 层在美国 runner 上要 10-22 分钟(见 sandbox_image_plan 的注释与
    # ci.yml 里的同一段实证)，再加 16 条 gVisor 用例就一定撞线。
    # 实测:2026-09-10 / 09-12 main 自己两次撞 20 分钟被 cancel，09-13 #1486
    # 那次 16 条用例一条都没跑到(collected 之后 19m51s 全在 docker-buildx)。
    #
    # 30 → 45(同日,补 30 分钟那次漏掉的一边)。30 分钟约等于**一次冷建本身**
    # ——#1486 rebase 到含 #1540 的 main 之后实测 `Build sandbox image` 花
    # **29m27s**，套件只剩 22 秒就被砍。冷建不是异常路径:**改完 apt 层之后
    # 的第一批 PR 必然是冷的**(写这份新层缓存的是 main 的 push 那一跑，它还没
    # 跑完时，PR 就只能全建)。给 30 分钟等于没有余量。
    #
    # 与 ci.yml 的 integration job 40→60 是同一条理由的两边，一起看。
    timeout-minutes: 45
    # Shared-runner Docker is bursty and gVisor setup is new here; do not gate
    # PRs on it yet (mirrors the main integration job). Tighten once stable.
    #
    # **但 main 的 push 必须能报红(2026-09-21)。** 无条件的
    # ``continue-on-error: true`` 会把作业失败洗成工作流 ``success``,于是
    # 2026-09-19T06:22 上游删掉裸 runsc 二进制之后,main 上 09-19T12:47 与
    # 14:33 两次 push **都是红的而看板全绿**,两天没人发现;最后是靠两个
    # dependabot PR 的检查栏才暴露出来,而它一开始看着像"依赖升级搞坏的"。
    #
    # 所以按事件分档:PR 仍不挡(原判据不变,共享 runner 会抖),**main 的
    # push 照实报**。收紧到无条件之前需要一段干净样本 —— 实测 60 次运行
    # 40 成功 / 11 取消 / 9 失败,其中 11 次取消全是 09-12~09-13 那批 20/30
    # 分钟超时(已靠 45 分钟修掉)、9 次失败里 8 次是上游这次删二进制,
    # 而"超时修好之后、上游坏掉之前"的干净样本只有约 5 次,不足以支撑
    # 无条件收紧。
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install runsc (gVisor)
        # 上游在 2026-08-17 与 2026-09-07 之间换了发布布局:裸的 ``runsc`` /
        # ``runsc.sha512`` 被删掉,只剩 ``gvisor.tar.bz2`` / ``gvisor.tar.zstd``。
        # 实测该 bucket 的三个版本:20260601 只有裸二进制、20260817 两者都有
        # (过渡版)、20260907 与之后只有 tarball。``RUNSC_RELEASE`` 是
        # ``release/latest`` 这个会动的指针,所以上游一滚过去这一步就 404
        # (``wget`` 退出码 8 = 服务器返回错误响应)。
        #
        # 校验文件是标准 ``sha512sum`` 格式(``<摘要>  gvisor.tar.bz2``),
        # 与被删掉的 ``runsc.sha512`` 同形,``-c`` 原样可用。
        #
        # **整包解开,不能只取 runsc**:新的 ``runsc`` 会在自己所在目录旁找
        # ``gvisor-bin/``(``gvisor_sentry`` / ``checkpointgofer`` /
        # ``runsc-fd-parking`` 等)。缺了它会退回上游已废弃的内嵌回落(官方说
        # 2026-10 之后停止工作)或在运行时去下载 —— 两条都会让这个套件测的东西
        # 与生产跑的东西不是同一个。
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          url="https://storage.googleapis.com/gvisor/releases/${RUNSC_RELEASE}/${arch}"
          wget --quiet "${url}/gvisor.tar.bz2" "${url}/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          sudo tar -xf gvisor.tar.bz2 -C /usr/local/bin
          sudo chmod +x /usr/local/bin/runsc
          runsc --version

      - name: Register runsc with the Docker daemon
        run: |
          set -euo pipefail
          # ``runsc install`` writes the runtime into /etc/docker/daemon.json.
          sudo runsc install
          sudo systemctl restart docker
          # Fail loudly if the daemon did not pick up the runtime — otherwise
          # the suite would silently run under runc (the runtime assertion in
          # the suite is the second line of defence).
          docker info --format '{{json .Runtimes}}' | grep -q runsc

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync workspace
        run: uv sync --frozen

      # 这一档以前让 fixture 自己 `docker build` infra/sandbox-image —— 每次都是
      # 冷建。ci.yml 的 integration job 早就改成「预构建一次 + 用
      # EXPERT_WORK_TEST_SANDBOX_IMAGE 让 fixture docker tag 借用」，这里漏了。
      #
      # 同一个 Dockerfile + context + inputs ⇒ 与 ci.yml / sandbox-image.yml 同一组
      # 缓存键，共享一个 scope。cache-to 只在 push main 时写:每条 PR 分支各写一份
      # 会吃光仓库 10 GB 缓存预算，把 main 的热层挤掉。
      #
      # continue-on-error + 下面的 env 兜底:这一步失败(例如 FROM 解析撞上
      # ECR Public 限流)时 env 置空，fixture 退回自己 build，行为与从前逐字相同。
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build sandbox image (gha cache)
        id: sandbox-image
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/sandbox-image
          file: infra/sandbox-image/Dockerfile
          load: true
          tags: expert-work-sandbox:ci
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor, B-60)
        # Ubuntu 24.04 restricts userns creation to AppArmor profiles that grant
        # ``userns``; the sandbox runs ``apparmor=unconfined`` (docker-default
        # carries ``deny mount,``), so lift the restriction on this runner only.
        # Production is ACS (no AppArmor at all); this is a CI-host setting.
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run sandbox acceptance suite under gVisor
        # --timeout 是第二道闸:job 被 cancel 时 pytest 连 summary 都不输出(B-55
        # 记的诊断障碍就是这个)，用例级超时至少能让挂住的那条自己报名字。
        env:
          EXPERT_WORK_TEST_SANDBOX_RUNTIME: runsc
          # 预构建失败时为空 → fixture 自己 build。
          EXPERT_WORK_TEST_SANDBOX_IMAGE: ${{ steps.sandbox-image.outcome == 'success' && 'expert-work-sandbox:ci' || '' }}
        run: >-
          uv run pytest -v -m integration --timeout=900 --timeout-method=thread
          services/sandbox-supervisor/tests/test_supervisor_integration.py

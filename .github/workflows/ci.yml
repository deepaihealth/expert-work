name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.9.26"

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # "true" = 本次改动碰了文档以外的东西 → 重活照跑。
      # 只有在能**确定**全部改动都落在纯文档范围内时才置 false;任何算不出来的
      # 情况(非 PR 事件、拿不到 base、diff 失败)一律 true —— 这道判断的失败方向
      # 必须是"多跑一次",不能是"静默跳过测试"。
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "push / 非 PR 事件 —— 无条件跑全套"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA"); then
            echo "拿不到 diff —— 保守跑全套"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$files" ]; then
            echo "零改动 —— 无需跑重活"
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "改动文件:"
          printf '%s\n' "$files"
          # 纯文档 = 全部落在 docs/ 下,或是仓库根目录的 .md。
          # 刻意**不**含 .github/(那是 CI 本身)、infra/、任何包内 .md
          # (ruff 会伸进 markdown 代码块,包内 .md 改动能真把 lint 弄红)。
          if printf '%s\n' "$files" | grep -qvE '^(docs/.+|[^/]+\.md)$'; then
            echo "含非文档改动 —— 跑全套"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "纯文档改动 —— 跳过 pytest / integration"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync workspace
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: metric naming lint (subsystems/20 § 5.2)
        run: uv run python tools/observability/check_metric_names.py

      - name: RLS naming lint (STREAM-C-DESIGN § 2.4)
        run: uv run python tools/persistence/check_rls_naming.py

      - name: audit-write path lint (STREAM-D-DESIGN § 6)
        run: uv run python tools/persistence/check_audit_insert_path.py

      - name: harness compliance lint (STREAM-SE-DESIGN § SE-F)
        run: uv run python tools/harness/check_harness_compliance.py

      - name: protected pins guard (PROD-7 / X-14 P2)
        run: uv run python tools/ci/check_protected_pins.py

      - name: image registry guard (X-8)
        run: uv run python tools/ci/check_image_registry.py

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync workspace
        run: uv sync --frozen

      - name: mypy strict
        run: uv run mypy packages services/audit-backup-worker/src services/billing-rollup-job/src services/event-log-archive-job/src services/orchestrator/src services/retention-cleanup-job/src

  test:
    name: Test (pytest)
    needs: changes
    # 纯文档改动跳过。被 ``if`` 跳过的 job 上报 skipped,而 required status check
    # 把 skipped 记作通过 —— 与"因 paths 过滤整个 workflow 不触发"不同,后者
    # 会让必需 check 永不上报、PR 永久 pending。
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Unit-only path; ``integration`` marker (testcontainers Postgres /
    # MinIO / pgbouncer compose) runs in the separate ``test-integration``
    # job so a slow Docker image pull on the runner never gates the PR.
    # History: 10min → 20min (2026-07, suite at ~9m35s / 5222 tests) → 40min
    # (2026-08-11, main itself running 17m50s-18m21s with one run already
    # cancelled at the finish line). Both raises were stopgaps, and by
    # 2026-08-14 main was at 29m17s — 11 minutes from the cap again.
    #
    # 2026-08-14 — the real fix: ``-n auto`` (pytest-xdist) below.
    # Measured job time on this runner: 29m17s → 11m32s (2.5x).
    #
    # Do NOT extrapolate the local numbers: 12m47s serial → 3m28s at -n 4
    # locally is 3.7x, but the runner only delivers 2.5x. Per-worker startup
    # (each imports the whole app) is a fixed cost the local box hides.
    #
    # The long-assumed blocker ("needs the fixtures audited for parallel
    # safety first") turned out not to exist: zero fixtures needed changing.
    # What actually blocked xdist was two modules interpolating ``uuid4()``
    # into their parametrize ids, so every worker collected a different test
    # set. Keep parametrize ids deterministic.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync workspace
        run: uv sync --frozen

      - name: Run pytest (unit)
        # --timeout: a hung test (e.g. uvicorn SSE shutdown) fails fast + names
        # itself instead of hanging the job until the 10-min cancel.
        # -n auto: one worker per runner core (see timeout-minutes above).
        # Dropped -v: with workers interleaving, per-test lines lose their
        # ordering anyway, and 7621 of them bury the failure summary.
        run: uv run pytest -m "not integration" -n auto --timeout=120 --timeout-method=thread

  test-integration:
    name: Test (integration)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Image pulls on shared runners are bursty; allow this job to fail
    # without gating the PR (until self-hosted runners with warm Docker
    # caches land). 2026-08-20: main-branch baseline is 7-15 min, but a
    # burst of ~8 concurrent runs hit Docker Hub throttling on the shared
    # runner IPs and testcontainers pulls (inside pytest's clock) pushed
    # runs to 24:36+ — the 25-min budget then killed fully green runs
    # ("567 passed" printed, then "operation was canceled"). 40 buys
    # burst headroom and matches the unit job.
    #
    # 2026-08-31 (X-8): official images moved to ``public.ecr.aws/docker/library``
    # (guard: tools/ci/check_image_registry.py). 2026-09-07 correction: ECR
    # Public throttles anonymous pulls per source IP too — five red runs that
    # day, all ``toomanyrequests: Rate exceeded`` on nginx / mock-upstream /
    # python base images, whenever 3-5 runs started within a few minutes.
    # Mitigation = pre-pull with backoff OUTSIDE the pytest clock
    # (tools/ci/prepull_images.py) + fixtures with ``pull=False`` so a locally
    # cached image is not re-validated against a throttled registry.
    #
    # 2026-09-08 (X-8 收官): pgvector / pgbouncer (Docker Hub only, no other
    # public source) now come from ghcr.io/deepaihealth/mirror/ — copied weekly
    # by .github/workflows/mirror-images.yml, pulled here with GITHUB_TOKEN
    # (credentialed quota, not the anonymous per-IP one). Docker Hub pull
    # still left: searxng/searxng. ECR Public official images stay anonymous,
    # so the pre-pull backoff stays.
    timeout-minutes: 40
    continue-on-error: true
    # ghcr.io needs packages:read (a private mirror package is a hard
    # requirement; a public one does not care). The read-only GITHUB_TOKEN of
    # dependabot / fork PRs includes it too.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync workspace
        run: uv sync --frozen

      - name: Log in to GHCR (mirror packages)
        # Before the pre-pull: the mirror refs are in the compose image set.
        # Works whether the packages are public or private; SHA-pinned like
        # every other docker/* action in this repo.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull images (backoff on registry throttling)
        # Computes the image set (compose full+proxy profiles + Dockerfile
        # FROMs the suite builds + docker-run constants) and pulls each with
        # a 15/30/60/90/120s backoff. Never fails the job: whatever is still
        # missing is left for the tests, whose failure message names the
        # image (expert_work.testing.explain_compose_pull_failure).
        run: uv run python tools/ci/prepull_images.py

      # X-8 收官 ③ — the sandbox image is built ONCE here with the gha layer
      # cache, and the two integration fixtures that used to `docker build`
      # infra/sandbox-image themselves (control-plane egress e2e, then the
      # sandbox-supervisor acceptance suite) `docker tag` it instead when
      # EXPERT_WORK_TEST_SANDBOX_IMAGE is set. Evidence (2026-09-07, two
      # 40-min reds, jobs 101723418926 / 101731671992): the pre-pull step
      # reported 12/12 images present — the base image was local — yet the
      # egress e2e build hit its 600s gate inside the Dockerfile's apt layer
      # (`Get:4 http://mirrors.aliyun.com/debian ...`), and the supervisor
      # fixture then rebuilt from scratch for 22 min more. ~350 MB of debs
      # from a mainland mirror on a US runner is the slow layer, not the
      # registry pull; a cache hit restores it without touching apt at all.
      #
      # Same Dockerfile + context + inputs as sandbox-image.yml → same cache
      # keys, one shared scope. cache-to only on main pushes: every PR branch
      # writing its own copy would eat the repo's 10 GB cache budget and
      # evict main's warm layers. continue-on-error + the env fallback below:
      # if this step fails (e.g. the FROM metadata resolve hits ECR Public
      # throttling), pytest runs exactly as before — the fixtures build.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build sandbox image (gha cache)
        id: sandbox-image
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: infra/sandbox-image
          file: infra/sandbox-image/Dockerfile
          load: true
          tags: expert-work-sandbox:ci
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      - name: Run pytest (integration)
        # --timeout: second gate behind the per-command docker timeouts in
        # test_fullstack_egress_e2e. A hung test names itself and fails fast
        # instead of burning the full 40-min job budget for a bare "The
        # operation was canceled" (2026-08-28: three such runs in one day).
        # 1800s is deliberately loose — this suite's own baseline is 9-15 min
        # end to end, and the slowest single test (the #60 egress stack, which
        # builds four images) sits around 5 min on a warm runner.
        env:
          # Empty when the prebuild step failed → fixtures build themselves.
          EXPERT_WORK_TEST_SANDBOX_IMAGE: ${{ steps.sandbox-image.outcome == 'success' && 'expert-work-sandbox:ci' || '' }}
        run: uv run pytest -v -m integration --timeout=1800 --timeout-method=thread

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync workspace
        run: uv sync --frozen

      - name: Export non-workspace deps
        # pip-audit's --no-deps mode requires every line to pin a PyPI
        # version. A VCS dependency cannot, and it does not skip them — it
        # fails the whole run:
        #
        #   ERROR:pip_audit._cli:kruise-agents: URL requirements cannot be
        #   pinned to a specific package version
        #
        # Sandbox migration W1 introduced the first such dependency
        # (`kruise-agents`, the Agent Sandbox E2B patch — no PyPI release,
        # so uv.lock pins a GitHub rev).
        #
        # Splitting them out rather than filtering silently: a package that
        # leaves this file is a package nothing audits, which is a real
        # blind spot and belongs in the log, not in a grep nobody reads.
        # The same dependency also makes the control-plane image build
        # require GitHub reachability (services/control-plane/Dockerfile) —
        # both are arguments for vendoring it or mirroring it to an
        # internal index before production.
        run: |
          uv export --frozen --no-emit-workspace --no-hashes --format=requirements.txt \
            > requirements-full.txt
          grep -E '@ git\+' requirements-full.txt > requirements-vcs.txt || true
          if [ -s requirements-vcs.txt ]; then
            echo "::warning::VCS dependencies are OUTSIDE pip-audit's scope (no PyPI version to pin):"
            cat requirements-vcs.txt
          fi
          grep -vE '@ git\+' requirements-full.txt > requirements-audit.txt

      - name: pip-audit
        # PYSEC-2025-183 — published 2026-05-20 against pyjwt 2.12.1 (the
        # latest available release on PyPI). No fix version is shipped
        # upstream yet; ignore until pyjwt cuts a patched release.
        # Track: https://github.com/jpadilla/pyjwt/security/advisories
        # (re-evaluate when ``uvx pip index versions pyjwt`` shows >2.12.1).
        #
        # B-24 — pypi.org occasionally read-times-out mid-audit (observed
        # 2026-07-27 as an uncaught ``requests.exceptions.ReadTimeout:
        # HTTPSConnectionPool(host='pypi.org', port=443): Read timed out.
        # (read timeout=15)``). That exits 1 — the same code as "vulnerabilities
        # found" — so the only lever is to retry the whole step: 3 attempts,
        # 10s/20s back-off. A genuine finding just fails three times (~7s
        # each, still far inside the job's 5-minute cap).
        run: |
          for attempt in 1 2 3; do
            if uvx pip-audit -r requirements-audit.txt --strict --disable-pip \
                --no-deps --ignore-vuln PYSEC-2025-183; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::pip-audit attempt ${attempt}/3 failed; retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done
          echo "::error::pip-audit failed on all 3 attempts"
          exit 1

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync workspace
        run: uv sync --frozen

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

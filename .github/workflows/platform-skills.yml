name: Platform skills (in sandbox image)

on:
  pull_request:
    branches: [main]
    paths:
      - "platform-skills/**"
      - "infra/sandbox-image/**"
      - ".github/workflows/platform-skills.yml"
  push:
    branches: [main]
    paths:
      - "platform-skills/**"
      - "infra/sandbox-image/**"
      - ".github/workflows/platform-skills.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  in-image:
    name: Platform skills — layer 2 (real sandbox image)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build sandbox image (load local, shared GHA cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/sandbox-image
          file: infra/sandbox-image/Dockerfile
          load: true
          tags: expert-work-sandbox:ci
          # FROM 从 GHCR 镜像仓解析(同一 digest),不走匿名 ECR Public —— 10-20 / 10-21
          # 这里连续撞 `429 Too Many Requests`,#1838 合入 main 后镜像因此没推上 ACR。
          # 与 ci.yml 同一写法;tests/test_mirror_images_workflow.py 钉住每个构建沙箱镜像的步骤。
          build-contexts: |
            public.ecr.aws/docker/library/python:3.12-slim=docker-image://ghcr.io/deepaihealth/mirror/python:3.12-slim
          cache-from: type=gha
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"   # 与 ci.yml 的 env.UV_VERSION 一致
          enable-cache: true
      - run: uv sync --frozen
      - name: Layer-2 tests
        env:
          EXPERT_WORK_SKILLS_TEST_IMAGE: expert-work-sandbox:ci
        run: uv run pytest platform-skills/tests/test_in_image.py -v --timeout=1800 --timeout-method=thread

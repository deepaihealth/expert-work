name: Sandbox Image

# Builds + CVE-scans the single sandbox image (infra/sandbox-image) —
# python:3.12-slim + office/data/media libraries + the system binaries skills
# shell out to (soffice/poppler/ffmpeg) + Node.js + CJK fonts. The former
# minimal/office variant split was collapsed into this one image
# (sandbox-image-consolidation). On PRs it builds, smoke-tests and Trivy-scans
# (no registry creds needed); on main / manual dispatch it also pushes a
# linux/amd64 image to Aliyun ACR when configured.
#
# The Trivy gate is CRITICAL-only (--ignore-unfixed): the LibreOffice + CJK +
# Node Debian base carries a large user-space library surface that keeps a HIGH
# count perpetually red and would defeat a CRITICAL,HIGH gate. gVisor — not the
# image's user-space libs — is the sandbox's real boundary; HIGH is still tracked
# by the SARIF report + the weekly full scan (sandbox-image-cve-weekly.yml).
#
# Registry wiring mirrors the office image (repo Settings → Secrets/variables):
#   vars.ALIYUN_ACR_REGISTRY / vars.ALIYUN_ACR_NAMESPACE
#   secrets.ALIYUN_ACR_USERNAME / secrets.ALIYUN_ACR_PASSWORD
# Then: EXPERT_WORK_SANDBOX_SANDBOX_IMAGE=<registry>/<namespace>/sandbox:latest

on:
  push:
    branches: [main]
    paths:
      - "infra/sandbox-image/**"
      - ".trivyignore"
      - ".github/workflows/sandbox-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/sandbox-image/**"
      - ".trivyignore"
      - ".github/workflows/sandbox-image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job builds an attacker-controllable Dockerfile on PRs.
# security-events:write lets the Trivy SARIF land in the Security tab; the
# registry push uses secrets.* directly, not GITHUB_TOKEN.
permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build + smoke + Trivy (+ push on main)
    runs-on: ubuntu-latest
    # Full image: LibreOffice + ffmpeg + Node add a large apt layer (~1 GB of
    # debs on a cold cache). Generous headroom; the gha cache warms it after
    # the first push.
    #
    # 90 → 180 → 90(2026-09-19 / 09-20)。中间那次 180 是为了让 arm64 建得完;
    # arm64 已经删掉(见下面 `platforms` 处的说明),所以退回 90。
    #
    # 这个 job 建**两次**:`Build (load local)` 建 amd64 供 smoke 与 Trivy 用
    # (冷建实测 26m51s),然后 `Build + push` 再建一次同一个平台。冷建约 54 分钟,
    # 90 留约 36 分钟余量。平时缓存命中在 15 分钟内;**改了 apt 包列表的那一次
    # 必然全冷建**,也正是最需要它成功的那一次(B-55 #1623 就是这么被 kill 的)。
    #
    # 与 sandbox-gvisor.yml 的 30 → 45、ci.yml integration 的 40 → 60 是同一条理由:
    # 冷建不是异常路径,是「改完那一层之后的第一批」的常态。
    timeout-minutes: 90
    steps:
      # Actions are SHA-pinned (a mutable tag could be re-pointed at malicious
      # code in this credential-holding workflow); the trailing comment tracks
      # the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 没有 QEMU 步骤:这个 workflow 只建 linux/amd64,runner 本身就是 amd64,
      # 不需要跨架构模拟(见下面 `platforms` 处的说明)。
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build into the local daemon so the smoke test + Trivy can use it.
      # Build context is infra/sandbox-image/ — the Dockerfile COPYs runner.py /
      # sitecustomize.py / requirements.txt / mpl_cjk_rc.py relative to its own dir.
      - name: Build (load local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/sandbox-image
          file: infra/sandbox-image/Dockerfile
          load: true
          tags: expert-work-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor, B-60)
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Smoke test (stdlib runner)
        run: python infra/sandbox-image/smoke_test.py expert-work-sandbox:ci

      # Two Trivy steps, not one: with `format: sarif` the trivy-action emits
      # an ALL-severity SARIF and its `severity` input does NOT constrain the
      # exit-code (aquasecurity/trivy-action#95) — so a single sarif+exit-code
      # step would gate on every severity, not the intended floor. Split:
      #   1) report (sarif, exit-code 0) → full audit surface, never fails.
      #   2) gate (table, severity floor, exit-code 1) → table format honours
      #      the severity filter for the exit-code.
      - name: Trivy report (SARIF, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: expert-work-sandbox:ci
          format: sarif
          output: trivy-sandbox.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-sandbox.sarif
          category: trivy-sandbox

      - name: Trivy gate (CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: expert-work-sandbox:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          skip-db-update: true # report step above already fetched the DB

      # ---- push (main / manual only, and only when the registry is configured)
      - name: Log in to Aliyun ACR
        if: github.event_name != 'pull_request' && vars.ALIYUN_ACR_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # 部署侧一律用 8 位短 sha(infra/k8s/sandbox/sandboxset.yaml 的 image、
      # tools/deploy/release.sh 的 --tag、`chore(deploy): ... newTag <sha8>`
      # 记录 PR),所以除完整 sha 外再打一个短的。三个 tag 指向同一份
      # manifest,ACR 上不额外占存储。
      - name: Short sha
        id: sha
        if: github.event_name != 'pull_request' && vars.ALIYUN_ACR_REGISTRY != ''
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build + push to ACR
        if: github.event_name != 'pull_request' && vars.ALIYUN_ACR_REGISTRY != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/sandbox-image
          file: infra/sandbox-image/Dockerfile
          push: true
          # 2026-09-20:**只建 amd64**,arm64 已删。
          #
          # 删它的依据是「ACR 上这个镜像的 arm64 那半边没有任何消费者」,逐条去数过:
          #   - 两个 ACS 集群的节点全是 amd64(测试 virtual-kubelet-cn-hangzhou-b/-g/-i,
          #     生产 -b/-j),而 ACR 上这个镜像的唯一消费者就是
          #     `infra/k8s/sandbox/sandboxset.yaml` 的那一行 image。
          #   - 应用镜像 `control-plane` 早就是单 amd64 manifest,生产从 09-16 一直在跑,
          #     `tools/deploy/build-push.sh` 里也明写 `--platform linux/amd64`
          #     加一句「the ACS cluster nodes are linux/amd64」。
          #   - 本地开发不从 ACR 拉这个镜像:`make build-sandbox` 在本机建
          #     `expert-work-sandbox:dev`,Apple silicon 上建出来的自然就是本机架构。
          #
          # 代价:arm64 那半边走 QEMU 模拟,apt 层在模拟下是数倍时间 —— #1623 那次
          # 冷建正是倒在它上面(90 分钟跑满被 kill,镜像没推上去)。
          #
          # 如果以后真需要 arm64(比如上了 arm 节点池),把它加回来的同时要把
          # timeout 一起抬回 180。
          platforms: linux/amd64
          # B-57 —— 关掉 provenance 证明。buildx 默认给推送附一份 attestation
          # 清单,它的配置 blob 用 `application/vnd.oci.empty.v1+json`;阿里云
          # ACR(个人版)不认这个 manifest class,推 manifest 时直接
          # `denied: unknown manifest class for application/vnd.oci.empty.v1+json`
          # —— 层全推成功了,倒在最后一步,整个镜像发不出去(#1513 的 9af710fc
          # 就是这么失败的)。
          #
          # 09-10 那次(weasyprint)还推得上去,而这个 workflow 自 09-07 没动、
          # `build-push-action` 钉在 v7.3.0 —— 变的是 `setup-buildx-action` 装的
          # buildx 二进制本身(action 版本钉了,它装的 buildx 跟上游 latest 走)。
          # 所以这不是一次性抖动,不关掉会一直推不上去。
          #
          # 代价是少一份 provenance 证明。但 ACR 本来就收不下它,现状不是
          # 「有证明」而是「镜像根本推不上去」;CVE 扫描走独立的 Trivy 步骤,不受影响。
          provenance: false
          # 仓库名是 `sandbox`,不是 `expert-work-sandbox`——命名空间里已经有
          # `expert-work` 了。集群那份(sandboxset.yaml)一直拉的就是
          # `<registry>/expert-work/sandbox:<sha8>`。
          tags: |
            ${{ vars.ALIYUN_ACR_REGISTRY }}/${{ vars.ALIYUN_ACR_NAMESPACE }}/sandbox:${{ github.sha }}
            ${{ vars.ALIYUN_ACR_REGISTRY }}/${{ vars.ALIYUN_ACR_NAMESPACE }}/sandbox:${{ steps.sha.outputs.short }}
            ${{ vars.ALIYUN_ACR_REGISTRY }}/${{ vars.ALIYUN_ACR_NAMESPACE }}/sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
